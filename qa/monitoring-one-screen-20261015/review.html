<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낌새 — 최근 변화 450×800 실제 CSS 렌더링 검사</title><style>body{font-family:system-ui,sans-serif;background:#e9efec;padding:16px;margin:0;color:#153a33}.wrap{max-width:720px;margin:auto}.warn{background:#fff;padding:12px 15px;border-radius:12px;font-size:14px;line-height:1.5}h1{font-size:21px;margin:12px 0}.device{margin:10px 0;width:450px;max-width:100%;overflow:auto}iframe{display:block;border:2px solid #294e4b;width:450px;height:800px;background:#fff}#result{white-space:pre-wrap;background:#fff;border-radius:12px;padding:14px;font:14px/1.5 ui-monospace,monospace;overflow:auto}</style></head><body><div class="wrap"><h1>낌새 최근 변화 · 450×800 실화면 CSS/DOM QA</h1><p class="warn">이 페이지는 배포 전 UI 확인용입니다. 실제 앱에서 사용하는 CSS와 premium-ux.js를 그대로 불러오며, 아래 수치만 모의 데이터입니다. 로그인·실제 서버 저장을 하지 않습니다.</p><div class="device"><iframe title="450×800 실화면 검증" id="frame" src="./review-frame.html" scrolling="no"></iframe></div><div id="result">화면 실제 크기 계산 중…</div></div><script>const iframe=document.getElementById('frame');iframe.addEventListener('load',()=>setTimeout(()=>{try{const d=iframe.contentDocument,frame=d.querySelector('.kimse-app'),summary=d.querySelector('.kimse-monitoring-one-screen'),details=d.querySelector('.kimse-monitoring-details');const rect=e=>{const a=e.getBoundingClientRect();return{top:Math.round(a.top),bottom:Math.round(a.bottom),height:Math.round(a.height),width:Math.round(a.width)}};const z={viewport:{width:iframe.contentWindow.innerWidth,height:iframe.contentWindow.innerHeight},app:rect(frame),summary:summary?rect(summary):null,details:details?rect(details):null,signals:d.querySelectorAll('.kimse-one-screen-signal').length,buttons:d.querySelectorAll('.kimse-one-screen-links a').length,oldFourCardLayout:d.querySelectorAll('.monitoring-journey').length,detailsInitiallyClosed:details?!details.open:false,allFirstScreenVisible:!!(details&&rect(details).bottom<=iframe.contentWindow.innerHeight-4),horizontalOverflow:d.documentElement.scrollWidth>iframe.contentWindow.innerWidth+1};const pass=z.viewport.width===450&&z.viewport.height===800&&z.signals===3&&z.buttons===2&&z.oldFourCardLayout===0&&z.detailsInitiallyClosed&&z.allFirstScreenVisible&&!z.horizontalOverflow;document.getElementById('result').textContent=(pass?'PASS: 450×800 한 화면 QA':'FAIL: 한 화면 조건 불충족')+'\n'+JSON.stringify(z,null,2)}catch(e){document.getElementById('result').textContent='FAIL '+String(e)}},1300))</script></body></html>
