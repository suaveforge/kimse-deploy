name: KIMSE Senior Design Polish Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/senior-design-polish-qa.cjs'
      - '.github/workflows/senior-design-polish-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live design release
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 'https://kimse.suaveforge.com/govtech-p0.css?qa=polish-57' -o /tmp/kimse-polish-live.css &&
              curl -fsSL --max-time 15 'https://kimse.suaveforge.com/app.js?qa=polish-57' -o /tmp/kimse-polish-live.js &&
              grep -Fq 'Senior Flow Design Polish' /tmp/kimse-polish-live.css &&
              grep -Fq "classList.add('is-confirming')" /tmp/kimse-polish-live.js; then
              echo 'KIMSE_LIVE_DESIGN_RELEASE=yes'; exit 0
            fi
            sleep 10
          done
          echo 'KIMSE_LIVE_DESIGN_RELEASE=no'; exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-polish-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-polish-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate senior UI and screenshots
        run: node tests/senior-design-polish-qa.cjs
      - name: Upload screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-senior-design-polish
          path: qa-artifacts/
          if-no-files-found: ignore
