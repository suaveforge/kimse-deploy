name: KIMSE Remaining Screens Mobile QA
on:
  push:
    branches: [ux-remaining-screens-20261013]
    paths:
      - 'tests/remaining-mobile-qa.cjs'
      - '.github/workflows/remaining-mobile-qa.yml'
      - 'app.js'
      - 'senior-journey.css'
      - 'premium-ux.js'
permissions:
  contents: write
jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kh-preview" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kh-preview/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture and measure all screen routes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kh-mobile-audit.log 2>&1 &
          sleep 2
          node tests/remaining-mobile-qa.cjs
      - name: Save all captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-remaining-mobile-qa
          path: qa-artifacts/remaining-mobile/
          if-no-files-found: ignore
      - name: Publish selected branch-only actual screenshots
        if: success()
        run: |
          mkdir -p qa-previews/remaining-mobile
          cp qa-artifacts/remaining-mobile/report.json qa-previews/remaining-mobile/report.json
          for r in health training medication settings accessibility medical-records clinical-handoff family-call family-feedback caregiver-home initial-result result evidence-proof research-engine monitoring-status; do
            cp "qa-artifacts/remaining-mobile/${r}-375-normal.png" "qa-previews/remaining-mobile/${r}-375.png"
          done
          for r in health training medication medical-records clinical-handoff; do
            cp "qa-artifacts/remaining-mobile/${r}-320-normal.png" "qa-previews/remaining-mobile/${r}-320.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-previews/remaining-mobile
          if ! git diff --cached --quiet; then
            git commit -m "docs(ux): capture all screens and vertical-density measurements"
            git push origin HEAD:ux-remaining-screens-20261013
          fi
