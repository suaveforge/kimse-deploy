name: KIMSE PUBLIC ALERT BM FIX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-alert-public.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct public alert-recipient rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const D={account:null,intent:null,self:false,care:false,mode:'self',caregivers:[],plan:'FREE'", "const D={account:null,intent:null,self:false,care:false,mode:'self',caregivers:[],alertRecipients:[],plan:'FREE'")
          s=s.replace("<small>첫 보호자/비상 알림 수신자 1인은 무료예요.</small>", "<small>가족/보호자 연결은 구독과 별개로 관리할 수 있어요.</small>")
          s=s.replace("<div class=\"summary-card bg-blue\"><h3>보호자 ${S.caregivers.length}명 연결</h3><p>첫 보호자 1인은 무료, 두 번째 활성 연결부터 구독이 필요해요.</p></div>", "<div class=\"summary-card bg-blue\"><h3>보호자 ${S.caregivers.length}명 연결</h3><p>가족 연결과 역할 관리는 구독 여부와 관계없이 사용할 수 있어요.</p></div>")
          s=s.replace("page.emergency=()=>wrap(`<h1 class=\"page-title\">비상 알림</h1><div class=\"summary-card bg-pink text-center\"><div style=\"font-size:58px\">🚨</div><h2>비상 알림</h2><p>사용자가 긴급 도움을 요청하면 연결된 가족에게 알림을 전달합니다.</p></div>${row('알림 수신자','','연결된 보호자')}${row('현재 상태','','알림 대기')}${notice('가족 연결','비상상태는 등록된 보호자에게 전달되도록 설계되어 있습니다.')}`,{title:'비상 알림',narrow:true});", "page.emergency=()=>wrap(`<h1 class=\"page-title\">비상 알림</h1><div class=\"summary-card bg-pink\"><h3>비상상태 알림 수신자 ${S.alertRecipients.length}명</h3><p>수신자 1인까지 무료이며, 2인째부터 구독이 적용됩니다.</p></div><div class=\"list\">${S.alertRecipients.map((x,i)=>row(x.name,i?'추가 수신자':'무료 수신자','알림 받음')).join('')||'<div class=\"empty-state\"><h3>등록된 비상알림 수신자가 없어요</h3></div>'}</div><button id=\"add-alert-recipient\" class=\"btn-kimse btn-primary-k btn-full mt-3\">+ 비상알림 수신자 추가</button>${notice('가족 연결과는 별개예요.','보호자 역할을 추가하는 것 자체에는 이 구독 제한을 적용하지 않습니다.')}`,{title:'비상 알림',narrow:true});")
          s=s.replace("<h3>기본 무료</h3><div class=\"price\">0원</div><p>보호자/비상 알림 1인 포함</p>", "<h3>기본 무료</h3><div class=\"price\">0원</div><p>비상상태 알림 수신자 1인 포함</p>")
          s=s.replace("<h3>프리미엄</h3><div class=\"price\">가족 확장</div><p>보호자 2인 이상, 가족 다중 알림, 상세 리포트</p><button id=\"premium\" class=\"btn-kimse btn-primary-k btn-full\">보호자 2인 이상 사용</button>", "<h3>프리미엄</h3><div class=\"price\">알림 확장</div><p>비상상태 알림 수신자 2인 이상, 가족 다중 알림, 상세 리포트</p><button id=\"premium\" class=\"btn-kimse btn-primary-k btn-full\">비상알림 2인 이상 사용</button>")
          s=s.replace("if(e.target.id==='add-family'){if(S.caregivers.length>=1&&S.plan!=='PREMIUM'){say('두 번째 보호자부터 구독이 필요합니다.');go('plan')}else{S.caregivers.push({name:`보호자 ${S.caregivers.length+1}`});save();render()}}", "if(e.target.id==='add-family'){S.caregivers.push({name:`보호자 ${S.caregivers.length+1}`});save();render()}if(e.target.id==='add-alert-recipient'){if(S.alertRecipients.length>=1&&S.plan!=='PREMIUM'){say('비상알림 수신자 2인째부터 구독이 필요합니다.');go('plan')}else{S.alertRecipients.push({name:`비상 연락처 ${S.alertRecipients.length+1}`});save();render()}}")
          s=s.replace("if(e.target.id==='premium'){S.plan='PREMIUM';save();say('가족 확장 기능이 적용되었습니다.');go('family')}", "if(e.target.id==='premium'){S.plan='PREMIUM';save();say('비상알림 수신자 확장 기능이 적용되었습니다.');go('emergency')}")
          p.write_text(s,encoding='utf-8')
          PY
          node --check app/app.js
          grep -q 'alertRecipients' app/app.js
          grep -q '비상알림 수신자 2인째부터 구독' app/app.js
          ! grep -q '두 번째 보호자부터 구독' app/app.js
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct KIMSE public alert subscription boundary"
          git push origin HEAD:main
