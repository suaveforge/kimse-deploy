name: KIMSE JsSIP Browser Bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jssip-browser-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JsSIP with browser bundler
        run: npm install --no-save --no-package-lock jssip@3.13.8 esbuild@0.25.12
      - name: Bundle current JsSIP release for native browser execution
        run: |
          node ./node_modules/esbuild/bin/esbuild ./node_modules/jssip/lib/JsSIP.js \
            --bundle --format=iife --global-name=JsSIP --platform=browser \
            --target=es2020 --minify --outfile=./jssip.browser.js
          test -s ./jssip.browser.js
      - name: Browser global export smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node -e "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch();const p=await b.newPage();await p.addScriptTag({path:'./jssip.browser.js'});const ok=await p.evaluate(()=>typeof JsSIP==='object'&&typeof JsSIP.UA==='function'&&typeof JsSIP.WebSocketInterface==='function');console.log('JSSIP_BROWSER_GLOBAL',ok);await b.close();if(!ok)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Keep tested bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimse-jssip-browser
          path: jssip.browser.js
          retention-days: 7
      - name: Commit tested browser bundle
        run: |
          git config user.name "kimse-library-bot"
          git config user.email "kimse-library-bot@users.noreply.github.com"
          git add jssip.browser.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(calls): bundle JsSIP for browser instead of loading CommonJS"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
