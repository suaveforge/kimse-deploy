name: KIMSE live 52-screen release verification
on:
  push:
    branches: [ux-52-mobile-final-20261014]
    paths:
      - 'tests/live-app-ui-qa.cjs'
      - '.github/workflows/live-app-ui-qa.yml'
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kh-preview" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kh-preview/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m pip install --user Pillow --break-system-packages
      - name: Verify live site
        run: node tests/live-app-ui-qa.cjs
      - name: Build contact sheet
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import os,glob
          p='qa-artifacts/ux-production';fs=sorted(glob.glob(p+'/*.png'))
          for start in range(0,len(fs),8):
              sub=fs[start:start+8];W,H=245,595
              out=Image.new('RGB',(W*4,H*2),'#efefef');d=ImageDraw.Draw(out)
              for i,f in enumerate(sub):
                  m=Image.open(f).convert('RGB');m.thumbnail((232,552))
                  x=(i%4)*W+5;y=(i//4)*H+32
                  out.paste(m,(x,y));d.text((x,y-25),os.path.basename(f),fill='#111')
              out.save(p+'/contact-%02d.png'%(1+start//8))
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-live-mobile-proof
          path: qa-artifacts/ux-production/
          if-no-files-found: ignore
      - name: Save screenshots on QA branch
        if: success()
        run: |
          mkdir -p qa-previews/ux-production
          cp qa-artifacts/ux-production/contact-*.png qa-previews/ux-production/
          cp qa-artifacts/ux-production/report.json qa-previews/ux-production/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-previews/ux-production
          if ! git diff --cached --quiet; then
            git commit -m "test(ux): save live production screenshot proof"
            git push origin HEAD:ux-52-mobile-final-20261014
          fi