name: KIMSE Home Preview Branch
on:
  push:
    branches: [ux-home-evidence-20261013]
    paths:
      - 'app.js'
      - 'app/app.js'
      - 'senior-journey.css'
      - 'app/senior-journey.css'
      - 'tests/home-branch-preview.cjs'
      - '.github/workflows/home-branch-preview.yml'
permissions:
  contents: write
jobs:
  home-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/kh-preview" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kh-preview/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture actual app preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kh-preview.log 2>&1 &
          sleep 2
          node tests/home-branch-preview.cjs
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-actual-home-preview
          path: qa-artifacts/home-preview/
          if-no-files-found: ignore

      - name: Publish branch-only visual QA captures
        if: success()
        run: |
          mkdir -p qa-previews/home
          cp qa-artifacts/home-preview/home-320-first-screen.png qa-previews/home/320-first-screen.png
          cp qa-artifacts/home-preview/home-375-first-screen.png qa-previews/home/375-first-screen.png
          cp qa-artifacts/home-preview/home-1440-normal.png qa-previews/home/1440-desktop.png
          cp qa-artifacts/home-preview/home-320-normal.png qa-previews/home/320-full.png
          cp qa-artifacts/home-preview/report.json qa-previews/home/report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-previews/home
          if ! git diff --cached --quiet; then
            git commit -m "docs(qa): refresh home branch-only Chromium screenshots"
            git push origin HEAD:ux-home-evidence-20261013
          fi
