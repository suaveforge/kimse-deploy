name: KIMSE Offline English Catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build-english-catalog.cjs'
      - '.github/workflows/english-catalog.yml'
permissions:
  contents: write
concurrency:
  group: kimse-offline-english-catalog-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local service
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kimse-en-source-server.log 2>&1 &
          sleep 2
      - name: Generate private-data-free English catalog
        env:
          MAX_TRANSLATIONS: "5000"
          TRANSLATION_CONCURRENCY: "5"
        run: node tools/build-english-catalog.cjs
      - name: Preserve generated English catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-offline-English-catalog
          path: kimse-en-auto.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit generated public catalog
        run: |
          git config user.name 'kimse-localization-bot'
          git config user.email 'kimse-localization-bot@users.noreply.github.com'
          git add kimse-en-auto.json
          if ! git diff --cached --quiet; then
            git commit -m "i18n: generate offline English public KIMSE UI catalog"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
