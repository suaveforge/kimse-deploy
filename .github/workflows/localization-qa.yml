name: KIMSE International English Localization QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'manifest-en.webmanifest'
      - 'call-transport.js'
      - 'kimse-en.json'
      - 'kimse-en-auto.json'
      - 'localizehub-runtime.js'
      - 'evidence/**'
      - 'tests/localization-browser.test.cjs'
      - 'tests/localization-deep-navigation.test.cjs'
      - 'tests/localization-regional.test.cjs'
      - '.github/workflows/localization-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-browser:
    name: English and Korean real-browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve public app and Evidence at Pages paths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kimse-i18n-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
      - name: Real Chromium language and English fallback QA
        run: |
          node tests/localization-browser.test.cjs
          node tests/localization-deep-navigation.test.cjs
          node tests/localization-regional.test.cjs
      - name: Wait for updated glossary on public Pages
        run: |
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 12 "https://kimse.suaveforge.com/kimse-en.json?probe=$GITHUB_SHA" | grep -q "Original detailed records for 11 competitors"; then
              echo "LIVE_GLOSSARY_DEPLOYED=$GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Public Pages glossary did not update" >&2
          exit 1
      - name: Real public-domain US UK KR Chromium QA
        env:
          KIMSE_TEST_BASE: https://kimse.suaveforge.com
        run: node tests/localization-regional.test.cjs
      - name: Preserve smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-international-english-smoke-qa
          path: /tmp/kimse-*-mobile.png
          retention-days: 7
          if-no-files-found: ignore
