name: KIMSE 52-screen vertical usability QA
on:
  push:
    branches: [ux-52-vertical-20261014]
    paths:
      - 'tests/full-app-vertical-qa.cjs'
      - '.github/workflows/full-app-vertical-qa.yml'
      - 'app.js'
      - 'senior-journey.css'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image library
        run: |
          npm install --prefix "$RUNNER_TEMP/kh-preview" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kh-preview/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m pip install --user Pillow --break-system-packages
      - name: Audit actual application layouts
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kh-vertical-preview.log 2>&1 &
          sleep 2
          node tests/full-app-vertical-qa.cjs
      - name: Build visual proof contact sheets
        if: always()
        run: |
          python3 - <<'PY'
          import os,glob,math
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          folder='qa-artifacts/ux-vertical'
          files=sorted(glob.glob(folder+'/mobile-*.png'))
          files=[x for x in files if not x.endswith('-full.png')]
          for k in range(0,len(files),8):
              subset=files[k:k+8]
              tile_w,tile_h=245,605
              sheet=Image.new('RGB',(tile_w*4,tile_h*2),'#efefef')
              d=ImageDraw.Draw(sheet)
              for i,p in enumerate(subset):
                  img=Image.open(p).convert('RGB');img.thumbnail((233,552))
                  x=(i%4)*tile_w+6;y=(i//4)*tile_h+36
                  sheet.paste(img,(x,y))
                  name=os.path.basename(p).replace('mobile-','').replace('.png','')
                  d.text((x,y-29),name,fill='#111111')
              sheet.save(folder+'/contact-%02d.png'%(k//8+1))
          PY
      - name: Upload audit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-52-vertical-proof
          path: qa-artifacts/ux-vertical/
          if-no-files-found: ignore
      - name: Save proof on QA branch only
        if: success()
        run: |
          mkdir -p qa-previews/ux-vertical
          cp qa-artifacts/ux-vertical/contact-*.png qa-previews/ux-vertical/
          cp qa-artifacts/ux-vertical/report.json qa-previews/ux-vertical/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-previews/ux-vertical
          if ! git diff --cached --quiet; then
            git commit -m "test(ux): publish measured 52-screen vertical audit and contact sheets"
            git push origin HEAD:ux-52-vertical-20261014
          fi