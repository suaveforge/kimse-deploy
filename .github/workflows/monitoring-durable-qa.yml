name: KIMSE durable offline journal QA
on:
  push:
    branches: [monitoring-durable-20261014]
    paths:
      - 'signal-journal.js'
      - 'app.js'
      - 'index.html'
      - 'tests/monitoring-durable-qa.cjs'
      - '.github/workflows/monitoring-durable-qa.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --prefix "$RUNNER_TEMP/kimse-qa" playwright@1.55.0 --no-fund --no-audit
          "$RUNNER_TEMP/kimse-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check durable queue with real Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kimse-offline.log 2>&1 &
          sleep 1
          node tests/monitoring-durable-qa.cjs
