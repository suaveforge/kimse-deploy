name: KIMSE Premium UX QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/premium-ux-qa.yml'
      - 'index.html'
      - 'service-worker.js'
      - 'app.js'
      - 'app.css'
      - 'accessibility-enhancements.css'
      - 'accessibility-enhancements.js'
      - 'premium-ux.css'
      - 'premium-ux.js'
      - 'govtech-p0.css'
      - 'govtech-p0.js'

permissions:
  contents: read

jobs:
  premium-ux-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live Release 39 assets
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL --max-time 10 "https://kimse.suaveforge.com/premium-ux.js?qa=${GITHUB_SHA}-${i}" | grep -Fq "const VERSION='39'" && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/premium-ux.css?qa=${GITHUB_SHA}-${i}" | grep -Fq 'Release 39.5 · product-first universal readable floor' && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/govtech-p0.js?qa=${GITHUB_SHA}-${i}" | grep -Fq '치매상담콜센터' && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/govtech-p0.css?qa=${GITHUB_SHA}-${i}" | grep -Fq '.gov-public-actions' && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/service-worker.js?qa=${GITHUB_SHA}-${i}" | grep -Fq 'release39-3-govtech-p0'; then
              echo "Live Release 39 premium UX is ready."
              exit 0
            fi
            echo "Waiting for Pages propagation ($i/40)..."
            sleep 5
          done
          echo "Live Release 39 did not propagate in time."
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install playwright --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Verify live premium UX, universal states and capture evidence
        run: |
          mkdir -p premium-ux-qa/screens
          cat > /tmp/kimse-premium-qa.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs'),path=require('path');
          const BASE='https://kimse.suaveforge.com/',OUT=path.resolve('premium-ux-qa');
          const log={base:BASE,startedAt:new Date().toISOString(),checks:[],screens:[],errors:[]};
          const check=(v,n,d='')=>{log.checks.push({name:n,ok:!!v,detail:d});if(!v)throw Error(n+': '+d);console.log('PASS',n,d)};
          const clone=o=>JSON.parse(JSON.stringify(o));
          const state={version:9,account:{name:'UX QA',email:''},intent:'self',self:true,care:true,mode:'self',caregivers:[{name:'가족 보호자',relation:'자녀'}],
            onboarding:{profileDone:true,initialDone:true,consentDone:true,completed:true},
            initial:{step:5,answers:{},responseTimes:[],recall:'',voiceSamples:[],voiceSkipped:true,completedAt:'2026-09-18T00:00:00+09:00',domains:{memory:86,executive:84,language:87,spatial:85,daily:88}},
            consents:{service:true,privacy:true,health:true,microphone:false,location:false,motion:false,usage:false,notifications:false,caregiverShare:true},
            baseline:{startedAt:new Date(Date.now()-15*86400000).toISOString()},
            monitoring:{pending:[],summary:{status:'READY',baseline_days:14,baseline_target_days:14,level:'ATTENTION',changes:[
              {metric:'sleep_minutes',baseline:425,recent:336,relative_change:-0.2094,changed:true},
              {metric:'steps',baseline:5120,recent:3460,relative_change:-0.3242,changed:true},
              {metric:'voice_pause_ratio',baseline:.18,recent:.23,relative_change:.2778,changed:true}],metrics:[],interpretation:'현재 결과는 변화 관찰을 위한 참고 정보이며 치매 진단을 의미하지 않습니다.'},alerts:[]},
            brainHistory:[{at:'2026-09-16T09:00:00+09:00',memory:86,executive:84,language:87,spatial:85,daily:88},{at:'2026-09-17T09:00:00+09:00',memory:84,executive:82,language:84,spatial:84,daily:87},{at:'2026-09-18T09:00:00+09:00',memory:80,executive:79,language:80,spatial:83,daily:85,flag:'attention',flagLabel:'수면 감소 · 활동 감소 · 말할 때 멈춤 증가'}],
            brainRange:'week',brainTrendDomain:'overall',brainFocus:'memory',brainView:'side',
            a11y:{largeText:false,highContrast:false,largeTouchTargets:false,voiceGuidance:false,soundEffects:false,captions:true,colorIcons:true,screenReader:true,reduceMotion:false}};
          const mergeA11y=a=>{const s=clone(state);s.a11y={...s.a11y,...(a||{})};return s};
          const marker={accessibility:'.accessibility-hero','monitoring-status':'.monitoring-journey','brain-trends':'.trend-chart-legend','brain-map':'.brain-map-stage'};
          async function open(browser,route,a11y={},viewport={width:430,height:932}){
            const ctx=await browser.newContext({viewport,deviceScaleFactor:1});
            await ctx.addInitScript(s=>localStorage.setItem('kimse.p0.state',JSON.stringify(s)),mergeA11y(a11y));
            await ctx.route('https://api-kimse.suaveforge.com/**',r=>r.abort('failed'));
            const p=await ctx.newPage();await p.goto(BASE+'#/'+route,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForSelector('#main',{timeout:15000});await p.waitForSelector(marker[route],{timeout:15000});await p.waitForTimeout(320);return {ctx,p};
          }
          async function shot(p,name){await p.evaluate(()=>{window.scrollTo(0,0);document.activeElement?.blur?.()});await p.waitForTimeout(80);await p.screenshot({path:path.join(OUT,'screens',name),type:'png',fullPage:false,animations:'disabled'});log.screens.push(name)}
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const shell=await (await (await browser.newContext()).request.get(BASE,{timeout:20000})).text();
            check(!shell.includes('\\n  <link')&&!shell.includes('\\n  <script'),'product-shell-no-stray-newline');
            for(const route of ['accessibility','monitoring-status','brain-trends','brain-map']){
              const {ctx,p}=await open(browser,route);
              check(await p.evaluate(()=>document.querySelector('#main')?.dataset.premiumUx==='39'),'premium-layer-'+route);
              check(await p.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'no-horizontal-overflow-'+route);
              await p.keyboard.press('Tab');check(await p.evaluate(()=>document.activeElement&&document.activeElement!==document.body),'keyboard-focus-'+route);
              if(route==='accessibility'){
                check(await p.locator('input[data-a11y="largeText"],input[data-a11y="highContrast"],input[data-a11y="largeTouchTargets"],input[data-a11y="reduceMotion"]').count()===4,'real-a11y-controls');
                check(await p.locator('input[data-a11y="captions"],input[data-a11y="colorIcons"],input[data-a11y="screenReader"]').count()===0,'no-fake-a11y-controls');
                check(await p.locator('.a11y-setting-row label').count()>=6,'a11y-setting-names');
                const footer=await p.locator('.app-footer').innerText();
                check((footer.match(/Release 39\.3/g)||[]).length===1&&!footer.includes('.3.3'),'footer-release-normalized',footer);
              }
              if(route==='monitoring-status'){
                await p.waitForSelector('#monitoring-a11y-summary');check(await p.locator('.result-change[aria-label]').count()===3,'monitoring-noncolor-labels');
                check(await p.locator('.monitoring-level-card[aria-describedby="monitoring-a11y-summary"]').count()===1,'monitoring-summary-link');
                const txt=await p.locator('.monitoring-journey').innerText();for(const t of ['14일의 평소','오늘의 변화','변화의 의미','다음 행동'])check(txt.includes(t),'monitoring-story-'+t);
                const minType=await p.evaluate(()=>Math.min(...[...document.querySelectorAll('.result-change small,.monitoring-level-note,.monitoring-level-top>small,.monitoring-level-badge>strong,.monitoring-detail-link,.screen-footnote')].filter(el=>getComputedStyle(el).display!=='none').map(el=>parseFloat(getComputedStyle(el).fontSize))));
                check(minType>=14,'mobile-readable-secondary-type',String(minType));
              }
              if(route==='brain-trends'){
                await p.waitForSelector('#brain-trends-a11y-summary');check(await p.locator('.overall-trend[aria-describedby="brain-trends-a11y-summary"]').count()===1,'trend-summary-link');
                check(await p.locator('button[data-brain-range][aria-pressed="true"]').count()===1,'trend-range-state');check(await p.locator('button[data-brain-domain][aria-pressed="true"]').count()===1,'trend-domain-state');
                check(await p.evaluate(()=>[...document.querySelectorAll('.trend-domain-tabs button')].every(el=>{const r=el.getBoundingClientRect();return r.left>=0&&r.right<=innerWidth})),'trend-tabs-within-viewport');
              }
              if(route==='brain-map'){
                await p.waitForSelector('#brain-map-a11y-summary');check(await p.locator('.brain-visual[aria-describedby="brain-map-a11y-summary"]').count()===1,'brain-map-summary-link');
                check(await p.locator('button[data-brain-focus][aria-pressed="true"]').count()===1,'brain-focus-state');check(await p.locator('button[data-brain-view][aria-pressed="true"]').count()===1,'brain-view-state');
                check(await p.evaluate(()=>{const c=document.querySelector('.brain-map-controls');if(!c)return false;const r=c.getBoundingClientRect();return r.right<=innerWidth&&r.bottom<=innerHeight+1}),'brain-map-controls-in-viewport');
              }
              await shot(p,route+'.png');await ctx.close();
            }
            const hc=await open(browser,'monitoring-status',{highContrast:true});check(await hc.p.evaluate(()=>document.documentElement.classList.contains('high-contrast')),'high-contrast-active');check((await hc.p.locator('.monitoring-conclusion').innerText()).includes('다음 행동'),'high-contrast-same-meaning');await shot(hc.p,'monitoring-high-contrast.png');await hc.ctx.close();
            const lt=await open(browser,'monitoring-status',{largeText:true});check(await lt.p.evaluate(()=>document.documentElement.classList.contains('large-text')),'large-text-active');check(await lt.p.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'large-text-no-horizontal-overflow');await shot(lt.p,'monitoring-large-text.png');await lt.ctx.close();
            const touch=await open(browser,'monitoring-status',{largeTouchTargets:true,reduceMotion:true});check(await touch.p.evaluate(()=>document.documentElement.classList.contains('large-touch')),'large-touch-active');check(await touch.p.evaluate(()=>document.documentElement.classList.contains('user-reduced-motion')),'reduced-motion-active');
            const mh=await touch.p.locator('.status-action').first().evaluate(el=>parseFloat(getComputedStyle(el).minHeight)||el.getBoundingClientRect().height);check(mh>=60,'large-touch-target-height',String(mh));await touch.ctx.close();
            for(const route of ['accessibility','monitoring-status','brain-trends','brain-map']){
              const {ctx,p}=await open(browser,route,{largeText:true,highContrast:true,largeTouchTargets:true,reduceMotion:true},{width:215,height:800});
              const m=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,mw:document.querySelector('#main')?.scrollWidth||0,mc:document.querySelector('#main')?.clientWidth||0}));
              check(m.sw<=m.cw+1&&m.mw<=m.mc+1,'reflow-200pct-equivalent-'+route,JSON.stringify(m));await ctx.close();
            }
            const gray=await open(browser,'monitoring-status');await gray.p.evaluate(()=>document.documentElement.style.filter='grayscale(1)');const g=await gray.p.locator('#main').innerText();check(g.includes('위험')&&g.includes('보호자')&&(g.includes('치매상담콜센터')||g.includes('1899-9988')),'grayscale-meaning-retained');await shot(gray.p,'monitoring-grayscale.png');await gray.ctx.close();
            const dc=await browser.newContext({viewport:{width:450,height:800}}),dp=await dc.newPage();await dp.goto(BASE+'#/demo-capture',{waitUntil:'domcontentloaded',timeout:30000});await dp.waitForSelector('#demo-preview',{timeout:15000});check(await dp.locator('#demo-preview').count()===1,'demo-capture-entry');await dc.close();
            log.finishedAt=new Date().toISOString();fs.writeFileSync(path.join(OUT,'qa.json'),JSON.stringify(log,null,2));
          }finally{await browser.close()}})().catch(e=>{log.errors.push(String(e.stack||e));fs.writeFileSync(path.join(OUT,'qa.json'),JSON.stringify(log,null,2));console.error(e);process.exit(1)});
          NODE
          node /tmp/kimse-premium-qa.cjs
      - name: Verify screenshot dimensions
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,struct
          for p in sorted(pathlib.Path('premium-ux-qa/screens').glob('*.png')):
              b=p.read_bytes(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',b[16:24]); assert (w,h)==(430,932),(p,w,h)
              print('PASS PNG',p,w,h,len(b))
          PY
      - name: Upload premium UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-premium-ux-qa
          path: premium-ux-qa
          if-no-files-found: error
          retention-days: 14
