name: Temporary cancel queued org runner validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-temp-org-runner-validation.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel queued public-repo self-hosted validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/runs/35304166348/cancel")"
          echo "cancel_http=$code"
          test "$code" = 202 || test "$code" = 409
