name: KIMSE Separate Speech Metrics and Cognitive Task Public Readiness
on:
  push:
    paths:
      - .github/workflows/voice-beta-public-readiness.yml
      - evidence/voice-analysis-beta.html
      - evidence/voice-analysis-beta.js
      - evidence/dementia-voice-assessment.html
      - evidence/dementia-voice-assessment.js
      - evidence/evidence-application-tabs.js
      - evidence/index.html
      - app.js
      - app/app.js
      - index.html
      - app/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for actual published files and test model task gates without generating a medical result
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          api='https://api-kimse.suaveforge.com/api/v1/evidence/voice-analysis/beta/'
          root='https://kimse.suaveforge.com/evidence/'
          headers={'User-Agent':'Kimse-QA/2.0','Cache-Control':'no-cache'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=17) as resp:
                  return resp.status,resp.read().decode('utf-8','replace')
          for attempt in range(16):
              try:
                  state=json.loads(get(api+'status')[1])
                  models=json.loads(get(api+'cognitive/models')[1])
                  page=get(root+'voice-analysis-beta.html?qa='+str(int(time.time())))[1]
                  cognitive=get(root+'dementia-voice-assessment.html?qa='+str(int(time.time())))[1]
                  signal_js=get(root+'voice-analysis-beta.js?qa='+str(int(time.time())))[1]
                  cog_js=get(root+'dementia-voice-assessment.js?qa='+str(int(time.time())))[1]
                  menu=get(root+'evidence-application-tabs.js?qa='+str(int(time.time())))[1]
                  assert state.get('ready') is True
                  assert models.get('english',{}).get('taskId')=='pitt_cookie_theft_excerpt_30s'
                  assert models.get('english',{}).get('models',{}).get('pitt_basic') is True
                  assert models.get('korean',{}).get('subtaskToModelMappingVerified') is False
                  assert models.get('korean',{}).get('inferenceEnabled') is False
                  assert 'voice-analysis-beta.js?v=20261028-signals-only1' in page
                  assert 'id="pitt-row" hidden' in page and 'id="extended-row" hidden' in page
                  assert 'id="cognitive-screening-status" aria-label="이전 모델 비교 자료" hidden' in page
                  assert 'id="result-research-overview"' in page
                  assert 'id="summary-pron"' in page and 'id="summary-delay"' in page and 'id="summary-vowel"' in page
                  assert 'dementia-voice-assessment.html' in page
                  assert 'const researchRequested=false' in signal_js
                  assert 'const extendedRequested=false' in signal_js
                  assert 'id="lang-en"' in cognitive and 'id="lang-ko"' in cognitive
                  assert 'id="model-pitt-basic"' in cognitive and 'id="model-pitt-full"' in cognitive
                  assert 'talkbank.org/dementia/protocol/participant/images/icons/cookie.jpg' in cognitive
                  assert 'AI-Hub 217' in cognitive and '세부 검사 문항' in cognitive
                  assert 'rawTrainingClassId' in cog_js and 'binaryTrainingPattern' in cog_js
                  assert '첫 번째 VGG16 입력' in cognitive and '두 번째 VGG16 입력' in cognitive
                  assert "/cognitive/guest" in cog_js
                  assert "state.language!=='en'" in cog_js
                  assert "choice('cognitive','09','치매 검사'" in menu
                  stable=json.loads(get('https://api-kimse.suaveforge.com/api/v1/evidence/voice-analysis/status')[1])
                  assert stable.get('ready') is True
                  print('PUBLIC_VOICE_SIGNAL_ONLY_AND_COGNITIVE_TASKS_PASS')
                  print('PUBLIC_MODEL_GATE',json.dumps({'english':models.get('english',{}).get('models'),'koreanTaskMapped':False},ensure_ascii=False))
                  break
              except (AssertionError,urllib.error.URLError,TimeoutError,KeyError,ValueError,TypeError) as ex:
                  print('PUBLIC_CHECK_WAIT',attempt+1,str(ex)[:120],flush=True)
                  if attempt==15:raise
                  time.sleep(8)
          PY
