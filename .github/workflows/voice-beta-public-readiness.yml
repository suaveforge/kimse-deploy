name: KIMSE Voice Signals and Cognitive Tasks Public Readiness
on:
  push:
    paths:
      - .github/workflows/voice-beta-public-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate published three signal metrics and separated language-task interfaces
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          api='https://api-kimse.suaveforge.com/api/v1/evidence/voice-analysis/beta'
          page='https://kimse.suaveforge.com/evidence/'
          headers={'User-Agent':'Kimse-QA/1.0','Cache-Control':'no-cache'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=20) as r:
                  assert r.status==200,(u,r.status)
                  return r.read().decode('utf-8','replace')
          # During blue/green deployment, static Pages and API are not atomic.
          # A bounded retry handles propagation, but cannot fake any result.
          for attempt in range(1,21):
              try:
                  state=json.loads(get(api+'/status'))
                  cognitive=json.loads(get(api+'/cognitive/models'))
                  signal=get(page+'voice-analysis-beta.html?qa='+str(int(time.time())))
                  assessment=get(page+'dementia-voice-assessment.html?qa='+str(int(time.time())))
                  js=get(page+'voice-analysis-beta.js?qa='+str(int(time.time())))
                  app=get(page+'dementia-voice-assessment.js?qa='+str(int(time.time())))
                  home=get(page+'?qa='+str(int(time.time())))
                  if ('20261028-signals-only1' not in signal or
                      'cognitive-menu1' not in home or
                      cognitive.get('english',{}).get('taskId')!='pitt_cookie_theft_excerpt_30s'):
                      raise AssertionError('PAGES_API_DEPLOY_PROPAGATING')
                  break
              except (urllib.error.URLError,TimeoutError,ValueError,AssertionError) as e:
                  if attempt==20:raise
                  print('CANDIDATE_PROPAGATION_ATTEMPT',attempt,str(e)[:150],flush=True)
                  time.sleep(15)
          assert state.get('ready') is True and state.get('evidenceGuestQuickEnabled') is True
          assert state.get('researchBinaryAvailable') is True
          assert state.get('onsetAzureEnabled') is True
          assert 'id="summary-pron"' in signal and 'id="summary-delay"' in signal and 'id="summary-vowel"' in signal
          assert 'id="pitt-row" hidden' in signal and 'id="extended-row" hidden' in signal
          assert 'id="cognitive-screening-status" aria-label="이전 모델 비교 자료" hidden' in signal
          assert 'id="result-research-overview" aria-label="분리된 치매 검사 모델 결과" hidden' in signal
          assert 'const researchRequested=false;' in js and 'const extendedRequested=false;' in js
          assert 'status:\'signal_measurements_only\'' in js
          assert 'id="lang-en"' in assessment and 'id="lang-ko"' in assessment
          assert 'id="model-pitt-basic"' in assessment and 'id="model-pitt-full"' in assessment
          assert 'SCI vs OTHERS' in assessment and 'MCI vs AD' in assessment
          assert 'https://talkbank.org/dementia/protocol/participant/images/icons/cookie.jpg' in assessment
          assert 'id="research-consent"' in assessment and 'id="stimulus-confirm"' in assessment
          assert 'pitt_cookie_theft_excerpt_30s' in app
          assert "state.language!=='en'" in app
          assert "rawTrainingClassId" in app and "binaryTrainingPattern" in app
          assert cognitive.get('english',{}).get('models',{}).get('pitt_basic') is True
          assert cognitive.get('korean',{}).get('subtaskToModelMappingVerified') is False
          assert cognitive.get('korean',{}).get('inferenceEnabled') is False
          print('KIMSE_THREE_ORIGINAL_SIGNALS_UNCHANGED_RESEARCH_FLAGS_OFF=PASS')
          print('KIMSE_ENGLISH_PITT_BASIC_AND_FUSION_TASKS_PUBLISHED=PASS')
          print('KIMSE_KOREAN_AIHUB_UNVERIFIED_TASKS_FAIL_CLOSED=PASS')
          print('KIMSE_PUBLIC_EVIDENCE_AND_COGNITIVE_ROUTES=PASS')
          PY
