name: KIMSE Older Adult Onboarding Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/older-adult-profile-qa.cjs'
      - '.github/workflows/older-adult-profile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live wizard rollout
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 15 'https://kimse.suaveforge.com/app.js?qa=20261009-53' -o /tmp/kimse-profile-qa-live.js && grep -Fq 'PROFILE_WIZARD_STEPS' /tmp/kimse-profile-qa-live.js; then
              echo 'KIMSE_PROFILE_LIVE_JS=yes'
              exit 0
            fi
            sleep 10
          done
          echo 'KIMSE_PROFILE_LIVE_JS=no'
          exit 1
      - name: Install Chromium QA
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-profile-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-profile-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test all 12 steps at six widths, normal/large/contrast
        run: node tests/older-adult-profile-qa.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-older-adult-onboarding-qa
          path: qa-artifacts/
          if-no-files-found: ignore
