name: KIMSE One Tap Health Record QA
on:
  push:
    branches: [main]
    paths:
      - tests/senior-health-one-tap-qa.cjs
      - .github/workflows/senior-health-one-tap-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  senior-health-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live health release
        run: |
          for n in $(seq 1 50); do
            if curl -fsSL --max-time 15 'https://kimse.suaveforge.com/app.js?audit=health-one-tap' -o /tmp/kimse-health.js &&
               grep -Fq 'kimse-health-sleep-option' /tmp/kimse-health.js; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-health-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-health-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check one-tap sleep recording and accessibility
        run: node tests/senior-health-one-tap-qa.cjs
      - name: Upload screen and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-health-one-tap
          path: qa-artifacts/
          if-no-files-found: ignore
