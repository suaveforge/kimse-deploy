name: KIMSE Senior Birth Year Selector QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/senior-birth-year-qa.cjs'
      - '.github/workflows/senior-birth-year-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  senior-birth-year-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployed keyboard-free birth selector
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 15 'https://kimse.suaveforge.com/app.js?qa=birth-picker-20261010' -o /tmp/kimse-birth-live.js &&
               grep -Fq 'function birthYearDecade()' /tmp/kimse-birth-live.js &&
               grep -Fq 'data-birth-decade=' /tmp/kimse-birth-live.js; then
              echo 'KIMSE_BIRTH_LIVE=yes';exit 0
            fi
            sleep 10
          done
          echo 'KIMSE_BIRTH_LIVE=no';exit 1
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-birth-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-birth-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify 54 year-selection flows at 6 widths and 3 accessibility modes
        run: node tests/senior-birth-year-qa.cjs
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-senior-birth-year-qa
          path: qa-artifacts/
          if-no-files-found: ignore
