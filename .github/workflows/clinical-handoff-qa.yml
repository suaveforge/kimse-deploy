name: KIMSE Clinical Handoff QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clinical-handoff-qa.yml'
      - 'app.js'
      - 'app.css'
      - 'clinical-submission.js'
      - 'index.html'
      - 'service-worker.js'
      - 'evidence/evidence-application-tabs.js'

permissions:
  contents: read

jobs:
  clinical-handoff-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Install Playwright Chromium
        run: |
          npm install playwright pdf-lib --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Verify live Clinical Handoff explorer
        run: |
          mkdir -p clinical-handoff-qa
          cat > /tmp/kimse-clinical-handoff-qa.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs'),path=require('path');
          const BASE='https://kimse.suaveforge.com/';
          const out=path.resolve('clinical-handoff-qa');
          const crypto=require('crypto');
          const sha256=data=>crypto.createHash('sha256').update(data).digest('hex');
          // Pages deploy and QA start independently. Never verify stale live assets.
          const expectedAssets=['app.js','clinical-submission.js'].map(name=>({
            name,sha:sha256(fs.readFileSync(name))
          }));
          const waitForVerifiedPages=async()=>{
            for(let attempt=0;attempt<60;attempt++){
              const found=await Promise.all(expectedAssets.map(async asset=>{
                try{
                  const response=await fetch(BASE+asset.name+'?clinicalQaSha='+asset.sha.slice(0,16)+'&attempt='+attempt,
                    {cache:'no-store',signal:AbortSignal.timeout(12000)});
                  return response.ok&&sha256(Buffer.from(await response.arrayBuffer()))===asset.sha;
                }catch{return false;}
              }));
              if(found.every(Boolean)){
                console.log('KIMSE_CL11_DEPLOY_SOURCE_SHA_VERIFIED=yes',
                  expectedAssets.map(x=>x.name+':'+x.sha).join(' '));
                return;
              }
              if(attempt%6===0)console.log('KIMSE_CL11_AWAITING_PAGES_SHA attempt='+attempt,
                'match='+JSON.stringify(found));
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw Error('CL11_PAGES_DEPLOY_NOT_LIVE_EXACT_CHECKOUT_SHA');
          };
          const check=(v,n,d='')=>{if(!v)throw Error(n+': '+d);console.log('PASS',n,d)};
          const metric=(metric,label,domain,base,recent,rawSource='test-source')=>({
            metric,clinical_label:label,domain,baseline:base,recent,relative_change:(recent-base)/Math.abs(base||1),changed:true,
            evidence_status:'evidence_backed',evidence_refs:['#evidence-src-12'],interpretation_guard:'테스트 해석 한계',
            series:[
              {day:'2026-10-01',value:base,samples:1},
              {day:'2026-10-02',value:(base+recent)/2,samples:1},
              {day:'2026-10-03',value:recent,samples:1}
            ],
            raw_samples:[{source:rawSource,metric,value:recent,unit:'test',observed_at:'2026-10-03T09:00:00+00:00',metadata:{local_day:'2026-10-03'}}],
            deviation_summary:{status:'OBSERVED_DEVIATION',first_observed_deviation_at:'2026-09-20',latest_observed_deviation_at:'2026-10-03',observed_deviation_days:5,observed_post_baseline_days:9,deviation_span_days:14,gap_days_within_span:5,guard:'QA gap aware'},
            quality:{expected_calendar_days:30,valid_days:24,calendar_day_coverage:.8,missing_calendar_days:6,note:'QA coverage'}
          });
          const metrics=[
            metric('task_response_ms','반복과제 반응시간 변화','cognition_task',1200,1700),
            metric('location_radius_m','생활반경 변화','mobility',2500,1400,'geolocation-derived'),
            metric('sleep_minutes','수면시간 변화','sleep',430,350),
            metric('steps','활동량 변화','activity',6000,3800),
            metric('voice_pause_ratio','발화 중 멈춤 변화','speech',.18,.28,'voice-feature'),
            metric('call_count','통화 횟수 변화','social_interaction',5,2)
          ];
          const report={
            schema_version:'KIMSE_CLINICAL_HANDOFF_PAYLOAD_V2',generated_at:'2026-10-06T00:00:00Z',
            report_context:{profile:'KR',view_horizon_days:180,window_start:'2026-04-10',window_end:'2026-10-06',baseline_started_at:'2026-09-01',evidence_status:'kimse_operational'},
            subject:{care_subject_id:'qa-subject',display_name:'QA 환자'},
            previsit_summary:{handoff_reason:'최근 여러 생활영역 변화가 함께 관찰됨',data_sufficiency:'HIGH',first_observed_change_at:'2026-09-20T00:00:00Z',latest_observed_change_at:'2026-10-03T00:00:00Z',affected_domains:['cognition_task','mobility','sleep','activity','speech','social_interaction'],function_status:'COMPLEX_DIFFICULTY',latest_informant_assessment:'CONFIRMED',median_signal_coverage:.8,top_changes:metrics.slice(0,5),family_confirmed_count:1,professional_outcome_present:true},
            kimse_observation:{observation_pattern:'MULTI_DOMAIN_CHANGE',data_sufficiency:'HIGH',coverage:{},missing:[],explanation:{headline:'최근 여러 영역 변화'}},
            clinical_domains:{subjective_change:{self:'PRESENT',informant:'PRESENT',evidence_refs:['#evidence-src-23']},cognition:{latest_objective_observation:{state:'CHANGED'},repeatable_task_sessions:[{phase:'RECHECK'}],recent_kimse_assessments:[],evidence_refs:['#evidence-src-09'],guard:'임상 점수로 환산하지 않음'},function_independence:{status:'COMPLEX_DIFFICULTY',source_type:'informant_report',evidence_refs:['#evidence-src-17']},mood_behavior:{current_user_report:'평소와 비슷',status:'available',guard:'진단 아님'},sensory_motor:{hearing_context:'some',mobility_activity_signals:metrics.filter(x=>['mobility','activity'].includes(x.domain)),status:'available',guard:'진찰 대체 아님'},safety_support:{events:[],status:'not_collected',guard:'자동 판정 안 함'}},
            risk_confounders:{sleep_disturbance_context:'sometimes',mood_context:'평소와 비슷',sensory_impairment_context:'some',conditions_context:'고혈압',current_medications:[{name:'혈압약'}],medication_change:{status:'not_collected'},acute_illness_context:{status:'not_collected'}},
            clinical_coverage:[
              {id:'onset_trajectory',label:'변화 시작·경과',status:'available'},
              {id:'cognition',label:'인지 관련 변화',status:'available'},
              {id:'function',label:'일상기능·독립성',status:'available'},
              {id:'mood_behavior',label:'기분·행동 맥락',status:'available'},
              {id:'sensory_motor',label:'감각·운동 맥락',status:'available'},
              {id:'longitudinal_signals',label:'생활·디지털 종단 변화',status:'available'},
              {id:'risk_confounders',label:'위험요인·혼란요인',status:'available'},
              {id:'safety_support',label:'안전·지원 영향',status:'missing'},
              {id:'informant',label:'가족/Informant 확인',status:'available'},
              {id:'data_quality',label:'데이터 품질·출처',status:'available'},
              {id:'professional',label:'전문평가 결과',status:'available'}
            ],
            monitoring:{baseline_started_at:'2026-09-01',baseline_days:14,baseline_target_days:14,recent_window:'최근 3일',level:'ATTENTION',metrics},
            timeline:[
              {kind:'BASELINE_STARTED',at:'2026-09-01T00:00:00Z',label:'개인 기준선 기록 시작',metrics:[]},
              {kind:'SIGNAL_DEVIATION_ONSET',at:'2026-09-20T00:00:00Z',label:'생활반경 변화 · 첫 개인 기준선 이탈 관찰',detail:{observed_deviation_days:5,deviation_span_days:14,gap_days_within_span:5},metrics:['location_radius_m']},
              {kind:'KIMSE_CHANGE_ALERT',at:'2026-09-20T00:00:00Z',label:'평소와 다른 변화 조합이 관찰됨',metrics:['location_radius_m','sleep_minutes','steps','voice_pause_ratio']},
              {kind:'OBJECTIVE_COGNITIVE',at:'2026-09-23T00:00:00Z',label:'KIMSE 반복과제 관찰 기록',detail:{state:'CHANGED'},metrics:[]},
              {kind:'INFORMANT_FEEDBACK',at:'2026-09-24T00:00:00Z',label:'가족이 실제 변화를 확인함',detail:'약속 누락을 확인',metrics:[]},
              {kind:'PROFESSIONAL_OUTCOME',at:'2026-10-01T00:00:00Z',label:'전문평가 결과 기록',detail:{institution:'QA 병원',result_category:'MCI',provenance:'USER_ENTERED'},metrics:[]}
            ],
            cooccurrence:[{at:'2026-09-20T00:00:00Z',metrics:['location_radius_m','sleep_minutes','steps','voice_pause_ratio'],count:4,source:'change_alert'}],
            family_feedback:[{feedback_at:'2026-09-24T00:00:00Z',assessment:'CONFIRMED',action_taken:'CALL',note:'약속 누락 확인'}],
            professional_outcomes:[{evaluation_date:'2026-10-01',institution:'QA 병원',result_category:'MCI',provenance:'USER_ENTERED',clinical_impression:'추적 평가 필요',validated_assessments:[{text:'MoCA-K · 22/30'}],followup_plan:'1개월 후 재진'}],
            evidence_version:'Evidence Registry 14',model_version:'QA',disclaimer:'KIMSE 관찰값은 진단을 확정하지 않습니다.'
          };
          const state={version:13,account:{name:'QA',email:'qa@example.com'},intent:'self',self:true,care:false,mode:'self',caregivers:[],onboarding:{profileDone:true,initialDone:true,consentDone:true,completed:true},consents:{service:false,privacy:false,health:false,microphone:false,location:false,motion:false,usage:false,notifications:false,caregiverShare:false},remote:{accountId:'',subjectId:'',selfSubjectId:'',careSubjects:[],activeCareSubjectId:'',token:''},monitoring:{pending:[],summary:null,alerts:[],lastObserved:{},daily:{}},clinicalReport:report,professionalOutcomes:report.professional_outcomes,a11y:{largeText:false,highContrast:false,voiceGuidance:false,soundEffects:false,captions:true,largeTouchTargets:true,colorIcons:true,screenReader:true,reduceMotion:false}};
          (async()=>{
            await waitForVerifiedPages();
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:1,locale:'ko-KR'});
            await ctx.addInitScript(s=>localStorage.setItem('kimse.p0.state',JSON.stringify(s)),state);
            await ctx.route('https://api-kimse.suaveforge.com/**',r=>r.abort('failed'));
            const p=await ctx.newPage();
            await p.goto(BASE+'#/clinical-handoff',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.screen-clinical-handoff',{timeout:15000});
            await p.waitForSelector('.clinical-explorer',{timeout:15000});
            check(await p.locator('#clinical-target-country').count()===1,'recipient-country-selector-present');
            // CL11 original objective: the user can select all six researched countries,
            // all eleven institution IDs, and inspect all 91 source groups in the actual
            // patient page. None is a verified electronic receiver.
            const publicCrosswalk=JSON.parse(fs.readFileSync('clinical-public-form-crosswalk.json','utf8'));
            check(publicCrosswalk.entries.length===11,'eleven-public-research-providers');
            check(publicCrosswalk.entries.reduce((n,e)=>n+e.requirement_groups.length,0)===91,'ninety-one-official-research-groups');
            for(const country of ['KR','GB','US','CA','AU','JP']){
              await p.locator('#clinical-target-country').selectOption(country);
              const targets=publicCrosswalk.entries.filter(e=>e.country===country);
              const values=await p.locator('#clinical-target-institution option').evaluateAll(nodes=>
                nodes.map(n=>n.value).filter(Boolean));
              check(values.length===targets.length,'provider-options-for-'+country);
              for(const target of targets){
                await p.locator('#clinical-target-institution').selectOption(target.id);
                // Wait for the CURRENT institution, not merely a coincidentally
                // equal number of requirements still displayed from the
                // previous selection. This is a real UI-render consistency check.
                await p.waitForFunction(({count,url})=>{
                  const details=document.querySelector('details.clinical-delivery-notes');
                  const origin=document.querySelector('.clinical-visit-source a');
                  return origin?.getAttribute('href')===url&&
                    details?.querySelectorAll('ol>li').length===count;
                },{count:target.requirement_groups.length,url:target.source_url},{timeout:12000});
                const details=await p.locator('details.clinical-delivery-notes').textContent();
                check(details.includes(target.requirement_groups[0].wording),'original-wording-'+target.id);
                const expectedWithoutDirect=target.requirement_groups.filter(g=>g.related_paths.length===0).length;
                await p.waitForFunction(expected=>{
                  const section=document.querySelector('.clinical-delivery-preflight');
                  return !!section&&section.innerText.includes('선택 기관의 조사 항목 '+expected+'개 준비 상태');
                },target.requirement_groups.length,{timeout:12000});
                const readinessText=await p.locator('.clinical-delivery-preflight').innerText();
                check(readinessText.includes('앱 직접 대응 없음 '+expectedWithoutDirect),
                  'no-direct-clinical-field-gaps-'+target.id);
                check(readinessText.includes('병원 요구사항 충족률이나 제출 승인이 아닙니다'),
                  'public-research-is-not-approved-form-'+target.id);
                check(readinessText.includes('관련 기록 미수집'),
                  'actual-missingness-visible-'+target.id);

                check((await p.locator('.clinical-visit-brief').innerText()).includes('공개자료 참고'),'source-backed-patient-print-'+target.id);
                check((await p.locator('.clinical-visit-source a').getAttribute('href'))===target.source_url,'print-citation-matches-public-hospital-'+target.id);
                check(await p.locator('.clinical-visit-list li').count()<=6,'print-brief-six-or-fewer-gaps-'+target.id);
                check((await p.locator('.clinical-visit-brief').getAttribute('data-provider-approved'))==='false','print-never-hospital-approved-'+target.id);
                check(await p.locator('#clinical-electronic-submit').isDisabled(),'unapproved-receiver-blocked-'+target.id);
                if(target.id==='US-EMORY-COGNITIVE-NEUROLOGY')
                  check((await p.locator('.clinical-delivery-preflight').innerText()).includes('접수경로 상충'),
                    'Emory-conflicting-referral-route-is-not-authorized');
              }
            }
            await p.locator('#clinical-target-country').selectOption('KR');
            check(await p.locator('#clinical-target-institution').inputValue()==='','research-target-reset-before-main-test');

            check(await p.locator('#clinical-electronic-submit').isDisabled(),'no-approved-hospital-cannot-send');
            await p.locator('#clinical-target-country').selectOption('GB');
            await p.locator('#clinical-target-institution').selectOption('GB-DORSET-MAS');
            check(await p.locator('#clinical-electronic-submit').isDisabled(),'research-only-nhs-recipient-is-blocked');
            check((await p.locator('.clinical-delivery-preflight').innerText()).includes('수신 승인'),'unverified-destination-warning-visible');
            await p.locator('#clinical-target-department').fill('Neurology');
            await p.locator('#clinical-target-department').dispatchEvent('change');
            await p.waitForFunction(()=>document.querySelector('.clinical-specialty-review')?.dataset.specialtyFocus==='NEUROLOGY');
            check(await p.locator('#clinical-department-hints option').count()>=4,'specialty-selectable-hints');
            const specialtyPriority=await p.locator('.clinical-national-priority ol li').allTextContents();
            check(specialtyPriority.length===5 && specialtyPriority[1].includes('인지'),
              'neurology-moves-existing-cognitive-history-ahead-without-inventing-guidelines');
            check((await p.locator('.clinical-national-priority').innerText()).includes('기존 공개자료 항목만 재정렬했습니다'),
              'specialty-priority-editorial-not-provider-approved');
            await p.locator('#clinical-target-clinician').fill('Unverified clinician');
            await p.locator('#clinical-target-clinician').dispatchEvent('change');
            await p.locator('#clinical-target-institution').selectOption('GB-LEEDS-MAS');
            check((await p.locator('#clinical-target-department').inputValue())==='','hospital-change-clears-stale-department');
            check((await p.locator('#clinical-target-clinician').inputValue())==='','hospital-change-clears-stale-clinician');
            await p.locator('#clinical-target-country').selectOption('KR');
            check((await p.locator('#clinical-target-institution').inputValue())==='','country-change-clears-recipient');
            check(await p.locator('#clinical-electronic-submit').isDisabled(),'no-hospital-ack-fabricated');
            check(await p.locator('[data-clinical-domain]').count()===6,'six-domain-filters');
            check(await p.locator('.clinical-metric').count()===6,'all-metrics-visible');
            check(await p.locator('.clinical-quality-band').count()===1,'quality-overlay-visible');
            check(await p.locator('.clinical-deviation-copy').count()===6,'observed-onset-chip-visible');
            check(await p.locator('.clinical-event-signal_deviation_onset').count()>=1,'observed-onset-timeline-visible');
            check(await p.locator('.clinical-event-informant_feedback').count()===1,'informant-overlay-visible');
            check(await p.locator('.clinical-event-professional_outcome').count()===1,'professional-overlay-visible');

            await p.locator('[data-clinical-domain="speech"]').click();
            await p.waitForTimeout(80);
            check(await p.locator('.clinical-metric').count()===1,'speech-filter-one-metric');
            check((await p.locator('.clinical-metric h3').innerText()).includes('발화 중 멈춤'),'speech-filter-correct-metric');
            check(await p.locator('.clinical-quality-band-item').count()===1,'quality-filter-follows-domain');
            check(await p.locator('.clinical-time-metrics span').filter({hasText:'말할 때 멈춤'}).count()>=1,'timeline-follows-domain');

            await p.locator('.clinical-metric details summary').click();
            check(await p.locator('.clinical-raw-table').count()===1,'source-drilldown-table');
            check((await p.locator('.clinical-raw-table').innerText()).includes('voice-feature'),'source-event-provenance');
            check(!(await p.locator('.clinical-metric details').innerText()).includes('latitude'),'no-coordinate-exposure');

            await p.locator('[data-clinical-overlay="informant"]').click();
            await p.waitForTimeout(50);
            check(await p.locator('.clinical-event-informant_feedback').count()===0,'informant-overlay-toggle-off');
            await p.locator('[data-clinical-overlay="quality"]').click();
            await p.waitForTimeout(50);
            check(await p.locator('.clinical-quality-band').count()===0,'quality-overlay-toggle-off');

            await p.locator('[data-clinical-domain="all"]').click();
            await p.waitForTimeout(50);
            check(await p.locator('.clinical-metric').count()===6,'return-all-metrics');
            check(await p.locator('.clinical-cooccurrence-row').count()>=1,'cooccurrence-visible');
            const dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            check(dims.sw<=dims.cw+1,'mobile-no-horizontal-overflow',JSON.stringify(dims));
            await p.screenshot({path:path.join(out,'clinical-handoff-mobile.png'),fullPage:true});
            const desktop=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1,locale:'ko-KR'});
            await desktop.addInitScript(s=>localStorage.setItem('kimse.p0.state',JSON.stringify(s)),state);
            await desktop.route('https://api-kimse.suaveforge.com/**',r=>r.abort('failed'));
            const dp=await desktop.newPage();
            await dp.goto(BASE+'#/clinical-handoff',{waitUntil:'domcontentloaded',timeout:30000});
            await dp.waitForSelector('.clinical-explorer',{timeout:15000});
            check(await dp.locator('.clinical-explorer').count()===1,'desktop-explorer-visible');
            const dd=await dp.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            check(dd.sw<=dd.cw+1,'desktop-no-horizontal-overflow',JSON.stringify(dd));
            await dp.screenshot({path:path.join(out,'clinical-handoff-desktop.png'),fullPage:true});
            await dp.emulateMedia({media:'print'});
            check(await dp.locator('.clinical-interactive').evaluate(el=>getComputedStyle(el).display)==='none','print-hides-interactive');
            check(await dp.locator('.clinical-print-page').isVisible(),'print-summary-visible');
            const pdf=await dp.pdf({format:'A4',printBackground:true,margin:{top:'11mm',right:'11mm',bottom:'11mm',left:'11mm'}});
            check(pdf.length>10000,'a4-pdf-generated',String(pdf.length));
            const {PDFDocument}=require(process.cwd()+'/node_modules/pdf-lib');
            const pdfDocument=await PDFDocument.load(pdf);
            check(pdfDocument.getPageCount()===1,'a4-summary-exactly-one-page',String(pdfDocument.getPageCount()));
            fs.writeFileSync(path.join(out,'clinical-handoff-a4.pdf'),pdf);
            await dp.emulateMedia({media:'screen'});
            // The generic report must not show a specialty-specific medical plan.
            check(await dp.locator('.clinical-specialty-review').count()===0,
              'generic-report-stays-without-specialty-panel');
            const specialtyOrders={
              neurology:['trajectory','cognition','family','external'],
              geriatrics:['function','family','safety','medication'],
              psychiatry:['mood','family','function','medication'],
              'primary-care':['trajectory','medication','acute','external']
            };
            // Every route is an editorial reordering of canonical source records.
            // Clinical requirements, diagnoses and collected/missing status are untouched.
            // Unselected hospital + a recognized specialty must print a safe
            // patient-carried country/public-guidance panel, not an invented
            // hospital intake form. Exercise the actual live DOM and A4 PDF.
            for(const [specialty,department] of [
              ['neurology','신경과'],['geriatrics','노인의학과'],
              ['psychiatry','정신건강의학과'],['primary-care','가정의학과']
            ]){
              await dp.locator('#clinical-target-department').fill(department);
              // Explicitly exercise the production delegated "change" handler:
              // Playwright's Tab blur may race with DOM replacement after a
              // previous print-mode switch.
              await dp.locator('#clinical-target-department').dispatchEvent('change');
              await dp.waitForFunction(expected=>{
                const review=document.querySelector('.clinical-specialty-review');
                const brief=document.querySelector('.clinical-visit-brief');
                return review?.dataset.specialtyFocus===expected &&
                  brief?.textContent.includes('기관 미선택 · 병원별 공개 의뢰요건은 평가하지 않았습니다');
              },{neurology:'NEUROLOGY',geriatrics:'GERIATRICS',psychiatry:'PSYCHIATRY','primary-care':'PRIMARY_CARE'}[specialty],{timeout:12000});
              const review=dp.locator('.clinical-specialty-review');
              check(await review.count()===1,'specialty-has-source-grounded-review-'+specialty);
              check(await review.locator('li').count()===4,'specialty-four-card-review-'+specialty);
              const fields=await review.locator('li').evaluateAll(xs=>xs.map(x=>x.dataset.specialtyField));
              check(JSON.stringify(fields)===JSON.stringify(specialtyOrders[specialty]),
                'specialty-recorded-order-'+specialty,JSON.stringify(fields));
              check((await review.innerText()).includes('병원·의료진의 승인 서식이나 필수 검사 목록이 아닙니다'),
                'specialty-not-official-referral-'+specialty);
              // The synthetic psychiatry case legitimately has all four
              // categories recorded; never invent a missing result simply
              // to satisfy a QA assertion. Verify exact expected gaps.
              const expectedMissing={
                neurology:1,geriatrics:1,psychiatry:0,'primary-care':2
              }[specialty];
              const missingItems=review.locator('li[data-recorded="false"]');
              check(await missingItems.count()===expectedMissing,
                'specialty-exact-missing-count-'+specialty,String(expectedMissing));
              check((await missingItems.allInnerTexts()).every(t=>
                t.includes('자료 없음 · 정상 소견으로 해석하지 않음')),
                'specialty-missing-not-normal-'+specialty);
              if(specialty==='neurology'){
                check((await review.innerText()).includes('2026-09-20') &&
                  (await review.innerText()).includes('앱 반복과제 1회'),
                  'neurology-references-real-canonical-dates-and-rechecks');
              }
              if(specialty==='geriatrics'){
                check((await review.innerText()).includes('복잡한 일상기능에서 어려움') &&
                  (await review.innerText()).includes('혈압약'),
                  'geriatrics-references-function-and-medications');
              }
              if(specialty==='psychiatry'){
                check((await review.innerText()).includes('기분·행동 보고 있음') &&
                  (await review.innerText()).includes('가족 응답 1건'),
                  'psychiatry-keeps-mood-and-informant-separate');
              }
              if(specialty==='primary-care'){
                check((await review.innerText()).includes('급성질환·감염·입원') &&
                  (await review.innerText()).includes('자료 없음 · 정상 소견으로 해석하지 않음'),
                  'primary-care-highlights-acute-illness-missingness');
              }
              check(await dp.locator('.clinical-national-priority ol li').count()===5,
                'specialty-only-five-research-terms-'+specialty);
              check((await dp.locator('.clinical-visit-brief').getAttribute('data-provider-approved'))==='false',
                'specialty-only-not-provider-approved-'+specialty);
              check((await dp.locator('.clinical-visit-brief').getAttribute('data-transport-authorized'))==='false',
                'specialty-only-no-electronic-transport-'+specialty);
              check(await dp.locator('.clinical-visit-source a').count()===0,
                'specialty-only-no-fabricated-provider-'+specialty);
              await dp.emulateMedia({media:'print'});
              const specialtyPdf=await dp.pdf({format:'A4',printBackground:true,
                margin:{top:'11mm',right:'11mm',bottom:'11mm',left:'11mm'}});
              const specialtyPages=(await PDFDocument.load(specialtyPdf)).getPageCount();
              check(specialtyPdf.length>10000&&specialtyPages>=1&&specialtyPages<=3,
                'specialty-only-a4-pdf-'+specialty,String(specialtyPages));
              fs.writeFileSync(path.join(out,'clinical-handoff-'+specialty+'-no-hospital-a4.pdf'),specialtyPdf);
              await dp.emulateMedia({media:'screen'});
            }
            await dp.locator('#clinical-target-department').fill('');
            await dp.locator('#clinical-target-department').dispatchEvent('change');
            check(await dp.locator('.clinical-visit-brief').count()===0,
              'no-hospital-no-specialty-keeps-basic-print-compact');
            check(await dp.locator('.clinical-specialty-review').count()===0,
              'no-hospital-no-specialty-clears-review');

            await dp.locator('#clinical-target-country').selectOption('GB');
            await dp.locator('#clinical-target-institution').selectOption('GB-DORSET-MAS');
            await dp.waitForFunction(()=>document.querySelector('.clinical-visit-brief')?.textContent.includes('Dorset'),null,{timeout:12000});
            check((await dp.locator('.clinical-report-stamp').innerText()).includes('영국'),'uk-print-target-not-mislabeled-as-korean');
            check((await dp.locator('.clinical-visit-brief').innerText()).includes('Dorset'),'uk-public-source-inside-print-page');
            await dp.waitForFunction(()=>window.KIMSE_CLINICAL_SUBMISSION?.getRequirementsState?.()==='PUBLIC_RESEARCH_LOADED',null,{timeout:12000});
            await dp.waitForFunction(()=>!!document.querySelector('.clinical-visit-list .clinical-visit-trace a[href^="https://"]'),null,{timeout:12000});
            check(await dp.locator('#clinical-report-print').isEnabled(),'hospital-print-waits-for-research-crosswalk');
            check(await dp.locator('#clinical-preflight-print').isEnabled(),'both-print-buttons-wait-for-research-crosswalk');
            const printedOrigins=await dp.locator('.clinical-print-source-records').innerText();
            check(printedOrigins.includes('가족·보호자 관찰')&&printedOrigins.includes('외부 검사·의료기록')&&printedOrigins.includes('전문 의료진 평가'),
              'hospital-print-keeps-family-and-professional-source-separate');
            check(await dp.locator('.clinical-visit-list .clinical-visit-trace a[href^="https://"]').count()>=1,
              'priority-hospital-advice-links-original-public-source');
            await dp.emulateMedia({media:'print'});
            const hospitalPdf=await dp.pdf({format:'A4',printBackground:true,margin:{top:'11mm',right:'11mm',bottom:'11mm',left:'11mm'}});
            const hospitalPageCount=(await PDFDocument.load(hospitalPdf)).getPageCount();
            check(hospitalPageCount>=1&&hospitalPageCount<=3,'uk-targeted-a4-print-pages',String(hospitalPageCount));
            fs.writeFileSync(path.join(out,'clinical-handoff-uk-public-hospital-a4.pdf'),hospitalPdf);
            const evidencePage=await ctx.newPage();
            await evidencePage.goto(BASE+'evidence/clinical.html',{waitUntil:'domcontentloaded',timeout:30000});
            await evidencePage.waitForSelector('#clinical-requirements-mapped',{timeout:15000});
            check(await evidencePage.locator('#clinical-requirements-mapped').getAttribute('data-requirement-count')==='34','clinical-public-requirement-count');
            check(await evidencePage.locator('#clinical-requirements-mapped details').count()===7,'clinical-seven-public-institutions');
            check(await evidencePage.locator('#clinical-requirements-mapped details').first().locator('a[href^="https://"]').count()===1,'public-source-original-link');
            await evidencePage.locator('#clinical-requirements-mapped details').first().locator('summary').click();
            check(await evidencePage.locator('#clinical-requirements-mapped details').first().locator('tbody tr').count()>=2,'field-and-gap-mapping-visible');
            check((await evidencePage.locator('#clinical-requirements-mapped').innerText()).includes('승인'),'clear-not-approved-disclosure');
            const edims=await evidencePage.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            check(edims.sw<=edims.cw+1,'clinical-evidence-no-horizontal-overflow',JSON.stringify(edims));
            await evidencePage.screenshot({path:path.join(out,'clinical-evidence-crosswalk-mobile.png'),fullPage:true});
            await evidencePage.close();
            fs.writeFileSync(path.join(out,'result.json'),JSON.stringify({ok:true,checkedAt:new Date().toISOString(),pdfBytes:pdf.length},null,2));
            await desktop.close();await ctx.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
