name: KIMSE Senior UX Audit Corrections QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/senior-ux-corrections-qa.cjs'
      - '.github/workflows/senior-ux-corrections-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployed corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 55); do
            if curl -fsSL --max-time 15 'https://kimse.suaveforge.com/app.js?qa=ux-correction-1' -o /tmp/k.js &&
               grep -Fq 'const MIN_VOICE_SECONDS=30' /tmp/k.js &&
               grep -Fq 'function advanceProfileWizard()' /tmp/k.js &&
               grep -Fq 'data-feedback-field=' /tmp/k.js; then
               echo 'KIMSE_UX_CORRECTIONS_LIVE=yes';exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-ux-fix" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-ux-fix/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test senior user actions, storage and short voice protection
        run: node tests/senior-ux-corrections-qa.cjs
      - name: Archive screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-senior-ux-corrections-qa
          path: qa-artifacts/
          if-no-files-found: ignore
