name: KIMSE GovTech P0 QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/govtech-p0-qa.yml'
      - 'index.html'
      - 'service-worker.js'
      - 'govtech-p0.css'
      - 'govtech-p0.js'
permissions:
  contents: read
jobs:
  govtech-p0-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live GovTech P0 assets
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL --max-time 10 "https://kimse.suaveforge.com/govtech-p0.js?govqa=${GITHUB_SHA}-${i}" | grep -Fq '치매상담콜센터' && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/govtech-p0.css?govqa=${GITHUB_SHA}-${i}" | grep -Fq '.gov-public-actions' && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/service-worker.js?govqa=${GITHUB_SHA}-${i}" | grep -Fq 'release39-3-govtech-p0'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install playwright --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Verify GovTech product flow
        run: |
          mkdir -p govtech-p0-qa/screens
          cat > /tmp/govqa.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs'),path=require('path');
          const BASE='https://kimse.suaveforge.com/',OUT=path.resolve('govtech-p0-qa');
          const log={checks:[],screens:[],errors:[]},check=(v,n,d='')=>{log.checks.push({name:n,ok:!!v,detail:d});if(!v)throw Error(n+': '+d);console.log('PASS',n,d)};
          const now=Date.now(),day=n=>new Date(now-n*86400000).toISOString();
          const base={version:9,account:{name:'GovTech QA',email:''},intent:'self',self:true,care:true,mode:'self',caregivers:[{name:'가족 보호자',relation:'자녀'}],onboarding:{profileDone:true,initialDone:true,consentDone:true,completed:true},initial:{step:5,answers:{},responseTimes:[],recall:'',voiceSamples:[],voiceSkipped:true,completedAt:new Date().toISOString(),domains:{memory:86,executive:84,language:87,spatial:85,daily:88}},consents:{service:true,privacy:true,health:true,microphone:false,location:false,motion:false,usage:false,notifications:false,caregiverShare:true},permissions:{},remote:{accountId:'',subjectId:'',token:''},baseline:{startedAt:day(15)},health:{sleep:'',steps:'',pressure:'',memo:'최근 아침에 평소보다 피곤함'},mood:'보통이에요',monitoring:{pending:[],summary:{status:'READY',baseline_days:14,baseline_target_days:14,level:'ATTENTION',changes:[{metric:'sleep_minutes',baseline:425,recent:336,relative_change:-.2094,changed:true},{metric:'steps',baseline:5120,recent:3460,relative_change:-.3242,changed:true},{metric:'voice_pause_ratio',baseline:.18,recent:.23,relative_change:.2778,changed:true}]},alerts:[{id:'govqa',detected_at:new Date().toISOString()}]},brainHistory:[],brainRange:'week',brainTrendDomain:'overall',brainFocus:'memory',brainView:'side',a11y:{largeText:false,highContrast:false,largeTouchTargets:true,voiceGuidance:false,soundEffects:false,captions:true,colorIcons:true,screenReader:true,reduceMotion:false}};
          const clone=x=>JSON.parse(JSON.stringify(x));
          async function open(b,r,s=base,v={width:430,height:932}){const c=await b.newContext({viewport:v});await c.addInitScript(x=>localStorage.setItem('kimse.p0.state',JSON.stringify(x)),s);await c.route('https://api-kimse.suaveforge.com/**',x=>x.abort('failed'));const p=await c.newPage();await p.goto(BASE+'#/'+r,{waitUntil:'domcontentloaded'});await p.waitForSelector('#main');await p.waitForTimeout(450);return {c,p}}
          async function shot(p,n){await p.evaluate(()=>scrollTo(0,0));await p.screenshot({path:path.join(OUT,'screens',n),type:'png',animations:'disabled'});log.screens.push(n)}
          (async()=>{const b=await chromium.launch({headless:true});try{
            let x=await open(b,'monitoring-status');await x.p.waitForSelector('.monitoring-journey');let t=await x.p.locator('.monitoring-journey').innerText();for(const q of ['14일의 평소','오늘의 변화','변화의 의미','다음 행동'])check(t.includes(q),'story-'+q);check(await x.p.locator('a[href="tel:18999988"][data-gov="1"]').count()===1,'official-call');check(await x.p.locator('[data-share-monitoring]').count()===1,'share-action');await shot(x.p,'01_monitoring_public_action.png');await x.c.close();
            const no=clone(base);no.consents.caregiverShare=false;x=await open(b,'monitoring-status',no);await x.p.click('[data-share-monitoring]');await x.p.waitForURL(/#\/consent/);await x.p.waitForSelector('.gov-consent-guide');check(!(await x.p.locator('#consent-caregiver').isChecked()),'no-silent-share-consent');await x.p.check('#consent-caregiver');await x.p.click('#consent-form button[type="submit"]');await x.p.waitForURL(/#\/monitoring-status/,{timeout:15000});check(await x.p.evaluate(()=>JSON.parse(localStorage.getItem('kimse.p0.state')).consents.caregiverShare===true),'share-consent-persisted');await x.c.close();
            x=await open(b,'report');await x.p.waitForSelector('.gov-public-actions');t=await x.p.locator('#main').innerText();check(t.includes('진단 결과가 아닙니다'),'not-diagnosis');check(t.includes('14/14일')&&t.includes('최근 3일'),'periods');check(await x.p.locator('.gov-report-changes li').count()===3,'three-signals');check(t.includes('사용자·보호자 확인')&&t.includes('전문평가 시 참고 요약'),'professional-reference');check(await x.p.locator('a[href="tel:18999988"]').count()===1,'report-call');check(await x.p.locator('a[href="https://www.nid.or.kr/info/facility_list.aspx"]').count()===1,'official-center-search');await shot(x.p,'02_consultation_report.png');await x.c.close();
            x=await open(b,'caregiver-home');await x.p.waitForSelector('.gov-care-summary');t=await x.p.locator('.gov-care-summary').innerText();check(t.includes('공유된 변화 요약')&&t.includes('수면시간')&&t.includes('걸음수'),'caregiver-summary');await shot(x.p,'03_caregiver_shared_summary.png');await x.c.close();
            const aa=clone(base);aa.a11y={...aa.a11y,largeText:true,highContrast:true,reduceMotion:true};x=await open(b,'report',aa,{width:215,height:800});await x.p.waitForSelector('.gov-public-actions');const m=await x.p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,mw:document.querySelector('#main').scrollWidth,mc:document.querySelector('#main').clientWidth}));check(m.sw<=m.cw+1&&m.mw<=m.mc+1,'report-200pct-reflow',JSON.stringify(m));await x.c.close();
            x=await open(b,'demo-capture');check(await x.p.locator('.gov-demo-panel').count()===0,'default-demo-unchanged');await x.c.close();x=await open(b,'demo-capture?govtech=1');check(await x.p.locator('.gov-demo-panel [data-gov-demo]').count()===1,'gov-demo-driver');const original=await x.p.evaluate(()=>localStorage.getItem('kimse.p0.state'));await x.p.click('[data-gov-demo]');await x.p.waitForURL(/#\/demo-capture\?govtech=1/,{timeout:30000});await x.p.waitForSelector('.gov-demo-panel [data-gov-demo]',{timeout:10000});check(await x.p.evaluate(raw=>localStorage.getItem('kimse.p0.state')===raw,original),'gov-demo-restores-user-state');check(await x.p.evaluate(()=>sessionStorage.getItem('kimse.gov.demo.running')===null),'gov-demo-cleans-session');await x.c.close();
            fs.writeFileSync(path.join(OUT,'qa.json'),JSON.stringify(log,null,2));
          }finally{await b.close()}})().catch(e=>{log.errors.push(String(e.stack||e));fs.writeFileSync(path.join(OUT,'qa.json'),JSON.stringify(log,null,2));console.error(e);process.exit(1)});
          NODE
          node /tmp/govqa.cjs
      - name: Verify evidence PNGs
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,struct
          ps=sorted(pathlib.Path('govtech-p0-qa/screens').glob('*.png'))
          assert len(ps)>=3
          for p in ps:
              b=p.read_bytes(); w,h=struct.unpack('>II',b[16:24]); assert (w,h)==(430,932),(p,w,h)
          PY
      - name: Upload GovTech P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-govtech-p0-qa
          path: govtech-p0-qa
          if-no-files-found: error
          retention-days: 14
