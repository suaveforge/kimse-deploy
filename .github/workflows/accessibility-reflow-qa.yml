name: KIMSE Accessibility Reflow QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessibility-reflow-qa.yml'
      - 'app.js'
      - 'app.css'
      - 'accessibility-enhancements.css'
      - 'accessibility-enhancements.js'
      - 'service-worker.js'

permissions:
  contents: read

jobs:
  accessibility-reflow-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live accessibility assets
        run: |
          for i in $(seq 1 30); do
            js_ok=0
            css_ok=0
            if curl -fsSL --max-time 10 "https://kimse.suaveforge.com/accessibility-enhancements.js?qa=${GITHUB_SHA}-${i}" | grep -Fq 'aria-label*="인지 기능 연관 지도"'; then
              js_ok=1
            fi
            if curl -fsSL --max-time 10 "https://kimse.suaveforge.com/accessibility-enhancements.css?qa=${GITHUB_SHA}-${i}" | grep -Fq ':root{--kimse-primary:#12735e}' && \
               curl -fsSL --max-time 10 "https://kimse.suaveforge.com/accessibility-enhancements.css?qa=${GITHUB_SHA}-${i}" | grep -Fq '.app-footer{color:var(--kimse-muted)}'; then
              css_ok=1
            fi
            if [ "$js_ok" = "1" ] && [ "$css_ok" = "1" ]; then
              echo "Live accessibility assets and contrast fixes are ready."
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation ($i/30)..."
            sleep 5
          done
          echo "Live accessibility assets did not propagate in time."
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install playwright --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Verify reflow keyboard semantics and contrast
        run: |
          cat > /tmp/kimse-a11y-reflow.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const BASE='https://kimse.suaveforge.com/';
          const check=(v,n,d='')=>{if(!v)throw Error(n+': '+d);console.log('PASS',n,d)};
          const state={version:9,account:{name:'접근성 QA',email:'qa@example.com'},intent:'self',self:true,care:true,mode:'self',caregivers:[{name:'가족 보호자',relation:'자녀'}],onboarding:{profileDone:true,initialDone:true,consentDone:true,completed:true},initial:{step:5,answers:{},responseTimes:[],recall:'',voiceSamples:[],voiceSkipped:true,completedAt:'2026-09-17T00:00:00+09:00',domains:{memory:86,executive:84,language:87,spatial:85,daily:88}},consents:{service:true,privacy:true,health:true,microphone:false,location:false,motion:false,usage:false,notifications:false,caregiverShare:true},baseline:{startedAt:new Date(Date.now()-15*86400000).toISOString()},monitoring:{pending:[],summary:{status:'READY',level:'ATTENTION',changes:[{metric:'sleep_minutes',baseline:425,recent:336,relative_change:-0.2094,changed:true},{metric:'steps',baseline:5120,recent:3460,relative_change:-0.3242,changed:true},{metric:'voice_pause_ratio',baseline:.18,recent:.23,relative_change:.2778,changed:true}]},alerts:[]},brainHistory:[{at:'2026-09-15T09:00:00+09:00',memory:86,executive:84,language:87,spatial:85,daily:88},{at:'2026-09-16T09:00:00+09:00',memory:84,executive:82,language:84,spatial:84,daily:87},{at:'2026-09-17T09:00:00+09:00',memory:80,executive:79,language:80,spatial:83,daily:85,flag:'attention'}],a11y:{largeText:true,highContrast:true,largeTouchTargets:true,voiceGuidance:false,soundEffects:false,captions:true,colorIcons:true,screenReader:true,reduceMotion:true}};
          const channel=n=>{n/=255;return n<=.04045?n/12.92:Math.pow((n+.055)/1.055,2.4)};
          const rgb=s=>{const m=String(s).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);if(!m)throw Error('Unsupported color '+s);return [+m[1],+m[2],+m[3]]};
          const lum=s=>{const [r,g,b]=rgb(s).map(channel);return .2126*r+.7152*g+.0722*b};
          const ratio=(fg,bg)=>{const a=lum(fg),b=lum(bg),hi=Math.max(a,b),lo=Math.min(a,b);return (hi+.05)/(lo+.05)};
          (async()=>{const b=await chromium.launch({headless:true});try{
            const c=await b.newContext({viewport:{width:225,height:800},deviceScaleFactor:1});
            await c.addInitScript(s=>localStorage.setItem('kimse.p0.state',JSON.stringify(s)),state);
            const p=await c.newPage();
            for(const route of ['accessibility','monitoring-status','brain-map','brain-trends']){
              await p.goto(BASE+'#/'+route,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForSelector('#main',{timeout:15000});await p.waitForTimeout(160);
              const m=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,main:document.querySelector('#main')?.scrollWidth||0,mainc:document.querySelector('#main')?.clientWidth||0,large:document.documentElement.classList.contains('large-text'),contrast:document.documentElement.classList.contains('high-contrast'),reduced:document.documentElement.classList.contains('user-reduced-motion')}));
              check(m.sw<=m.cw+1,'no-page-horizontal-overflow-'+route,JSON.stringify(m));
              check(m.main<=m.mainc+1,'no-main-horizontal-overflow-'+route,JSON.stringify(m));
              check(m.large&&m.contrast&&m.reduced,'preferences-active-'+route,JSON.stringify(m));
              await p.keyboard.press('Tab');
              check(await p.evaluate(()=>document.activeElement&&document.activeElement!==document.body),'keyboard-focus-'+route);
            }
            await p.goto(BASE+'#/monitoring-status',{waitUntil:'domcontentloaded'});await p.waitForSelector('#monitoring-a11y-summary');
            check((await p.locator('#monitoring-a11y-summary').innerText()).trim().length>0,'monitoring-text-equivalent');
            check(await p.locator('.monitoring-level-card[aria-describedby="monitoring-a11y-summary"]').count()>=1,'monitoring-text-equivalent-link');
            await p.goto(BASE+'#/brain-trends',{waitUntil:'domcontentloaded'});await p.waitForSelector('#brain-trends-a11y-summary');
            check((await p.locator('#brain-trends-a11y-summary').innerText()).trim().length>0,'brain-trends-text-equivalent');
            check(await p.locator('.overall-trend[aria-describedby="brain-trends-a11y-summary"]').count()>=1,'chart-text-equivalent-link');
            await p.goto(BASE+'#/brain-map',{waitUntil:'domcontentloaded'});await p.waitForSelector('#brain-map-a11y-summary');
            check((await p.locator('#brain-map-a11y-summary').innerText()).trim().length>0,'brain-map-text-equivalent');
            check(await p.locator('.brain-visual[aria-describedby="brain-map-a11y-summary"]').count()>=1,'brain-map-text-equivalent-link');
            await p.goto(BASE+'#/accessibility',{waitUntil:'domcontentloaded'});await p.waitForSelector('#main');await p.waitForTimeout(160);
            await p.evaluate(()=>document.documentElement.classList.remove('high-contrast'));
            const colors=await p.evaluate(()=>{
              const btn=document.createElement('button');btn.className='btn-kimse btn-primary-k';btn.textContent='대비 테스트';document.body.appendChild(btn);
              const bs=getComputedStyle(btn);const primary={fg:bs.color,bg:bs.backgroundColor};btn.remove();
              const footer=document.querySelector('.app-footer');const fs=footer?getComputedStyle(footer):null;
              return {primary,footer:{fg:fs?.color||'',bg:'rgb(255, 255, 255)'}};
            });
            const primaryRatio=ratio(colors.primary.fg,colors.primary.bg);
            const footerRatio=ratio(colors.footer.fg,colors.footer.bg);
            check(primaryRatio>=4.5,'primary-button-contrast',primaryRatio.toFixed(2)+':1 '+JSON.stringify(colors.primary));
            check(footerRatio>=4.5,'footer-text-contrast',footerRatio.toFixed(2)+':1 '+JSON.stringify(colors.footer));
            await c.close();
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/kimse-a11y-reflow.cjs
