name: KIMSE Initial Check Senior Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/older-adult-initial-qa.cjs'
      - '.github/workflows/older-adult-initial-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initial-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployed initial check
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 15 "https://kimse.suaveforge.com/app.js?qa=initial-20261009-54" -o /tmp/kimse-initial-live.js && grep -Fq 'INITIAL_TASK_OPTIONS' /tmp/kimse-initial-live.js; then
              echo 'INITIAL_LIVE_JS=yes'
              exit 0
            fi
            sleep 10
          done
          echo 'INITIAL_LIVE_JS=no'; exit 1
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-initial-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-initial-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate six steps at six widths and three visual modes
        run: node tests/older-adult-initial-qa.cjs
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-initial-senior-qa
          path: qa-artifacts/
          if-no-files-found: ignore
