name: KIMSE Senior Editorial Visual QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/senior-editorial-visual-qa.cjs'
      - '.github/workflows/senior-editorial-visual-qa.yml'
      - 'app.js'
      - 'senior-journey.css'
      - 'premium-ux.js'
      - 'index.html'
      - 'service-worker.js'
permissions:
  contents: read
jobs:
  senior-editorial-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-editorial" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-editorial/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check senior legibility and record actual screenshots
        run: node tests/senior-editorial-visual-qa.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-senior-editorial-visual-evidence
          path: qa-artifacts/senior-editorial/
          if-no-files-found: ignore
