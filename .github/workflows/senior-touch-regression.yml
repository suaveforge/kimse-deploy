name: KIMSE Senior Touch Audit
on:
  push:
    branches: [main]
    paths:
      - tests/senior-touch-regression.cjs
      - .github/workflows/senior-touch-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published styles
        run: |
          for i in $(seq 1 45); do
            if curl -fsSL 'https://kimse.suaveforge.com/senior-journey.css?qa=68' -o /tmp/touch.css && grep -Fq 'Senior-wide minimum touch targets' /tmp/touch.css; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-touch-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-touch-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test 20 route sizes
        run: node tests/senior-touch-regression.cjs
