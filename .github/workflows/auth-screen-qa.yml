name: KIMSE Authentication Screen QA

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "app.css"
      - "index.html"
      - ".github/workflows/auth-screen-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kimse-auth-screen-qa
  cancel-in-progress: true

jobs:
  live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for actual deployed authentication assets
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 "https://kimse.suaveforge.com/?qa=$GITHUB_SHA" -o /tmp/auth-index.html &&
               curl -fsSL --max-time 15 "https://kimse.suaveforge.com/app.js?qa=$GITHUB_SHA" -o /tmp/auth-app.js &&
               curl -fsSL --max-time 15 "https://kimse.suaveforge.com/app.css?qa=$GITHUB_SHA" -o /tmp/auth-app.css &&
               grep -Fq '20261009-51' /tmp/auth-index.html &&
               grep -Fq 'auth-entry-form' /tmp/auth-app.js &&
               grep -Fq 'KIMSE account: distinct minimal sign-in' /tmp/auth-app.css; then
                echo 'KIMSE_AUTH_LIVE_ASSETS_OK=yes'
                exit 0
            fi
            sleep 8
          done
          echo 'KIMSE_AUTH_LIVE_ASSETS_OK=no';exit 1

      - name: Install browser
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-auth-qa" playwright@1.55.0 --no-fund --no-audit
          "$RUNNER_TEMP/kimse-auth-qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify real login, signup, and responsive layout
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/kimse-auth-qa/node_modules/playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [320,375,430,768,1280]){
                const page=await browser.newPage({viewport:{width,height:760},reducedMotion:'reduce'});
                const jsErrors=[];
                page.on('pageerror',e=>{
                  const stack=String(e.stack||e);
                  if(!stack.includes('cdn.jsdelivr.net/npm/jssip@3.13.8/lib/JsSIP.min.js'))jsErrors.push(stack);
                });
                await page.goto('https://kimse.suaveforge.com/?v=51#/auth',{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForSelector('#auth-entry-form',{timeout:20000});
                assert.equal(await page.locator('.screen-auth #name').count(),0,'name field on login');
                assert.equal(await page.locator('.screen-auth #email').count(),1);
                assert.equal(await page.locator('.screen-auth #auth-password').count(),1);
                assert.equal(await page.locator('.screen-auth #authhub-login').count(),1);
                assert.equal(await page.locator('.screen-auth #authhub-signup').count(),0);
                assert.equal(await page.locator('.screen-auth .auth-switch-link').innerText(),'계정 만들기');
                const modeInfo=await page.evaluate(()=>{
                  const el=document.querySelector('#authhub-login'),r=el.getBoundingClientRect(),root=document.querySelector('.screen-auth');
                  return {buttonWidth:r.width,buttonHeight:r.height,docWidth:document.documentElement.scrollWidth,screenWidth:innerWidth,
                    visibleText:root?.innerText||'',socialGroupVisible:!!document.querySelector('#auth-social-area')&&!document.querySelector('#auth-social-area').hidden};
                });
                assert(modeInfo.buttonHeight>=68&&modeInfo.buttonWidth<=322,'unwanted long flat button: '+JSON.stringify(modeInfo));
                assert(modeInfo.docWidth<=modeInfo.screenWidth+3,'login overflow');
                assert(!/AuthHub 계정|AuthHub 프로젝트 설정|로그인 수단을 불러오지 못했습니다|네트워크 연결 또는 AuthHub/.test(modeInfo.visibleText),'technical error presented to user');
                await page.locator('#email').fill('layout.test@example.invalid');
                await page.locator('.auth-switch-link').click();
                await page.waitForSelector('#authhub-signup');
                assert.equal(await page.locator('#name').count(),1,'signup name field missing');
                assert.equal(await page.locator('#auth-password').getAttribute('autocomplete'),'new-password');
                assert.equal(await page.locator('#email').inputValue(),'layout.test@example.invalid','switch lost entered email');
                assert.equal(await page.locator('#authhub-login').count(),0,'duplicate login action');
                assert.equal(await page.locator('.auth-switch-link').innerText(),'로그인');
                await page.locator('.auth-switch-link').click();
                await page.waitForSelector('#authhub-login');
                assert.equal(await page.locator('#name').count(),0,'name persisted on login');
                assert.equal(await page.locator('#auth-password').getAttribute('autocomplete'),'current-password');
                assert.equal(await page.locator('#email').inputValue(),'layout.test@example.invalid');
                assert.equal(jsErrors.length,0,'runtime JS error '+JSON.stringify(jsErrors));
                console.log('KIMSE_AUTH_SCREEN_PASS width='+width+' button='+modeInfo.buttonWidth+'x'+modeInfo.buttonHeight);
                if(width===375){
                  const config=await page.evaluate(async()=>{
                    try{
                      const x=await window.KIMSE_AUTH.config();
                      return {available:true,socialConfigured:!!x?.socialUi?.script,providerCount:Array.isArray(x?.providers)?x.providers.length:null};
                    }catch(e){return {available:false,status:e?.status||0,code:String(e?.message||'unknown').slice(0,90)}}
                  });
                  console.log('KIMSE_AUTHHUB_PUBLIC_CONFIG '+JSON.stringify(config));
                }
                await page.close();
              }
              console.log('KIMSE_AUTH_BOTH_MODES_AND_LAYOUT_OK=yes');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
