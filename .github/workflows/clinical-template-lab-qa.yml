name: KIMSE Licensed Clinical Template Browser QA
on:
  push:
    branches: [main]
    paths: ['clinical-template-lab.html','clinical-template-lab.js','clinical-template-lab.css','clinical-template-print.css','clinical-profile-resolver.js','clinical-profile-authorities.json','clinical-public-form-crosswalk.json','clinical-template-demo-data.json','.github/workflows/clinical-template-lab-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clinical-template-lab-browser
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Chromium browser
        run: |
          npm install playwright@1.56.1 --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Test live Tabler dashboard and ECharts charts
        run: |
          mkdir -p clinical-template-qa
          cat > ./test-template-browser.cjs <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch(),issues=[];
            for(const [name,width,height] of [['desktop',1440,900],['tablet-landscape',1024,768],['tablet-portrait',768,1024],['mobile',390,844]]){
              const ctx=await browser.newContext({viewport:{width,height},serviceWorkers:'block'}),page=await ctx.newPage();
              page.on('pageerror',e=>issues.push(name+':'+e.message));
              page.on('request',r=>{if(/api-kimse\.suaveforge\.com|\/api\/v1\//.test(r.url()))issues.push('UNSAFE_API_CALL:'+r.url())});
              const response=await page.goto('https://kimse.suaveforge.com/clinical-template-lab.html',{waitUntil:'domcontentloaded',timeout:45000});
              assert.equal(response.status(),200);
              await page.waitForFunction(()=>document.documentElement.dataset.clinicalTemplateReady!==undefined,{timeout:65000});
              assert.equal(await page.evaluate(()=>document.documentElement.dataset.clinicalTemplateReady),'yes','chart assets inaccessible');
              assert.equal((await page.locator('#metricCount').innerText()).trim(),'6개');
              assert.match(await page.locator('#summaryFamily').innerText(),/./,'family provenance must be visible in 10-second top summary');
              assert.match(await page.locator('#summaryProfessional').innerText(),/전문검사|외부 전문평가/,'medical results provenance must be stated without invented professional score');
              for(const anchor of ['#previsitSummaryHeading','#rawObservationsHeading','#trendChart','#hospitalRequirementsHeading'])assert.equal(await page.locator('nav[aria-label="진료 정보 바로가기"] a[href="'+anchor+'"]').count(),1,'missing clinician navigation '+anchor);

              assert.equal(await page.locator('#fieldList .list-group-item').count(),12,'all 12 clinical candidate fields must be accessible');
              assert.match(await page.locator('#fieldCoverage').innerText(),/12 \/ 12개/,'all candidate fields must be disclosed');
              assert.match(await page.locator('#periodInterpretation').innerText(),/최근 28일.*전체 28일.*재산출값이 아닙니다/,'28-day canonical representative scope must be explicit');
              assert.match(await page.locator('#demoVersion').innerText(),/공개조사 11기관 · 91개 연구 그룹 · 승인 0건/,'release label must be derived from the live official research registry');
              assert.match(await page.locator('#handoffReason').innerText(),/합성 예시/,'referral reason missing');
              assert.equal(await page.locator('#rawMetricRows tr').count(),6,'6 synthetic source-backed rows required');
              assert.equal(await page.locator('#rawMetricRows [data-source-code="native_step_counter_simulation"]').count(),1,'canonical source provenance attribute lost');
              assert.doesNotMatch(await page.locator('#rawMetricRows').innerText(),/native_step_counter_simulation/,'internal source code exposed as medical UI');
              assert.match(await page.locator('#rawMetricRows').innerText(),/가상 걸음수 센서/,'human-readable source missing');
              assert.match(await page.locator('#missingSummary').innerText(),/일상기능/,'missing clinical information must be explicit');
              assert.ok(await page.evaluate(()=>Boolean(window.echarts.getInstanceByDom(document.getElementById('trendChart')).getOption().toolbox?.[0]?.feature?.restore)),'official ECharts toolbox missing');
              const connectedZoom=await page.evaluate(async ()=>{
                const line=window.echarts.getInstanceByDom(document.getElementById('trendChart'));
                const heat=window.echarts.getInstanceByDom(document.getElementById('coverageChart'));
                const bars=window.echarts.getInstanceByDom(document.getElementById('changeChart'));
                line.dispatchAction({type:'dataZoom',start:23,end:78});
                await new Promise(resolve=>setTimeout(resolve,240));
                const p=line.getOption().dataZoom[0],q=heat.getOption().dataZoom[0];
                const result={trend:p.start,heat:q.start,heatHasZoom:!!q,distinctBarGroup:bars.group!==line.group};
                line.dispatchAction({type:'restore'});
                return result;
              });
              assert.equal(connectedZoom.heatHasZoom,true,'linked coverage dataZoom missing');
              assert.ok(Math.abs(connectedZoom.trend-connectedZoom.heat)<1,'official ECharts connected date range out of sync '+JSON.stringify(connectedZoom));
              assert.ok(connectedZoom.distinctBarGroup,'bar chart has unlike x-axis and must remain independent');
              const immutableRows=await page.locator('#rawMetricRows').innerText();
              for(const id of ['trendChart','coverageChart','changeChart'])assert.equal(await page.locator('#'+id+' canvas').count(),1,name+':'+id);
              await page.locator('#country').selectOption('GB');
              await page.locator('#institution').selectOption('GB-DORSET-MAS');
              assert.match(await page.locator('#selectionStatus').innerText(),/의료진 승인 없음/);
              assert.equal(await page.locator('#hospitalRequirements > .list-group-item').count(),20,'Dorset 19 official published form groups plus source footer');
              assert.match(await page.locator('#hospitalRequirements').textContent(),/병원 수신 확인·의료진 승인 0건/);
              await page.locator('#country').selectOption('CA');
              await page.locator('#institution').selectOption('CA-UHN-MEMORY-FORM');
              assert.equal(await page.locator('#hospitalRequirements > .list-group-item').count(),12,'UHN 11 published form groups plus source footer');
              assert.match(await page.locator('#hospitalRequirements').textContent(),/MoCA\/MMSE/);
              assert.match(await page.locator('#hospitalRequirements').textContent(),/Neuroimaging CD/);
              assert.match(await page.locator('#hospitalRequirements a').last().getAttribute('href'),/uhn\.ca\/UHNReferrals/);
              await page.locator('#country').selectOption('AU');
              await page.locator('#institution').selectOption('AU-NSW-HORNSBY-MEMORY');
              assert.equal(await page.locator('#hospitalRequirements > .list-group-item').count(),11,'AU 10 groups plus original source');
              await page.locator('#country').selectOption('JP');
              await page.locator('#institution').selectOption('JP-KYORIN-SUGINAMI-MEMORY');
              assert.equal(await page.locator('#hospitalRequirements > .list-group-item').count(),8,'JP 7 groups plus original source');
              assert.equal(await page.locator('#rawMetricRows').innerText(),immutableRows,'country must not alter canonical facts');
              assert.equal(await page.locator('#fieldList [data-guard-code="SELF_AND_INFORMANT_SEPARATE"]').count(),1,'canonical guard code must remain traceable');
              assert.doesNotMatch(await page.locator('#fieldList').innerText(),/SELF_AND_INFORMANT_SEPARATE/,'internal clinical guard exposed');
              assert.match(await page.locator('#fieldList').innerText(),/본인과 가족이 보고한/,'clinical explanation is missing');
              await page.locator('#country').selectOption('US');
              await page.locator('#institution').selectOption('US-EMORY-COGNITIVE-NEUROLOGY');
              assert.equal(await page.locator('#hospitalRequirements > .list-group-item').count(),16,'Emory 15 public research groups plus source footer');
              assert.equal(await page.locator('#requirementsExplanation').getAttribute('data-routing-conflict'),'unresolved','Emory source transport conflict must remain visible');
              assert.match(await page.locator('#requirementsExplanation').innerText(),/환자자료 발송 금지/);
              assert.equal(await page.locator('#institutionEvidenceDisclosure').evaluate(el=>el.open),false,'provider evidence must start collapsed');
              await page.locator('#institutionEvidenceSummary').focus();
              await page.keyboard.press('Enter');
              assert.equal(await page.locator('#institutionEvidenceDisclosure').evaluate(el=>el.open),true,'provider detail must be keyboard/mouse accessible');
              assert.equal(await page.locator('#hospitalRequirements [data-source-trace]').count(),15,'Emory source group links remain reachable');
              assert.equal(await page.locator('#rawMetricRows').innerText(),immutableRows,'changing to Emory must not rewrite observed source facts');
              assert.equal(await page.locator('#fieldList .list-group-item').count(),12,'JP professional and external fields must not be hidden');

              if(name==='desktop'){
                const research=JSON.parse(require('node:fs').readFileSync('clinical-profile-authorities.json','utf8'));
                const forms=JSON.parse(require('node:fs').readFileSync('clinical-public-form-crosswalk.json','utf8'));
                assert.equal(research.institutions.length,11);
                assert.equal(forms.entries.length,11);
                assert.equal(forms.entries.reduce((sum,e)=>sum+e.requirement_groups.length,0),91);
                assert.ok(research.institutions.every(i=>!i.clinical_reviewer_approved&&!i.kimse_electronic_receiver_approved));
                const immutable=await page.locator('#rawMetricRows tr').evaluateAll(rows=>rows.map(r=>Array.from(r.children).slice(0,4).map(c=>c.textContent.trim())));
                let checked=0;
                for(const inst of research.institutions){
                  await page.locator('#country').selectOption(inst.country);
                  await page.locator('#institution').selectOption(inst.id);
                  const officialGroup=forms.entries.find(entry=>entry.id===inst.id);
                  assert.ok(officialGroup,inst.id+' no canonical published source');
                  assert.equal(await page.locator('#hospitalRequirements [data-source-trace]').count(),officialGroup.requirement_groups.length,inst.id+' official source item links missing');
                  const actual=await page.locator('#hospitalRequirements [data-source-trace]').evaluateAll(links=>links.map(el=>({id:el.dataset.requirementId,trace:el.dataset.sourceTrace,href:el.getAttribute('href')})));
                  const expected=officialGroup.requirement_groups.map(item=>{
                    const url=item.source_url||officialGroup.source_url;
                    const pdf=Number.isInteger(item.source_page)&&item.source_page>0&&/\.pdf(?:\?|$)/i.test(url);
                    const heading=!pdf&&item.source_locator_type==='HTML_SECTION_HEADING'&&Boolean(item.source_heading);
                    return {id:item.id,trace:pdf?'PDF_PAGE_INDEXED':heading?'HTML_SECTION_HEADING':'OFFICIAL_URL_SECTION_UNLOCATED',href:url+(pdf?'#page='+item.source_page:'')};
                  });
                  assert.deepEqual(actual,expected,inst.id+' source hyperlinks must not fabricate HTML anchors or omit PDF pages');
                  assert.equal(Number(await page.locator('#sourceTraceSummary').getAttribute('data-pdf-page-mapped')),expected.filter(x=>x.trace==='PDF_PAGE_INDEXED').length);
                  assert.equal(Number(await page.locator('#sourceTraceSummary').getAttribute('data-html-section-mapped')),expected.filter(x=>x.trace==='HTML_SECTION_HEADING').length);
                  assert.equal(Number(await page.locator('#sourceTraceSummary').getAttribute('data-unlocated')),expected.filter(x=>x.trace==='OFFICIAL_URL_SECTION_UNLOCATED').length);

                  for(const days of ['28','14','7']){
                    await page.locator('#period').selectOption(days);
                    assert.equal(await page.locator('#fieldList .list-group-item').count(),12,inst.id+' full field coverage');
                    assert.equal(await page.locator('#rawMetricRows tr').count(),6);
                    const current=await page.locator('#rawMetricRows tr').evaluateAll(rows=>rows.map(r=>Array.from(r.children).slice(0,4).map(c=>c.textContent.trim())));
                    assert.deepEqual(current,immutable,inst.id+' '+days+' must preserve canonical baseline, recent and changes');
                    assert.equal(await page.locator('#periodInterpretation').getAttribute('data-selected-period-days'),days);
                    assert.match(await page.locator('#periodInterpretation').innerText(),new RegExp('최근 '+days+'일.*전체 28일.*재산출값이 아닙니다'));
                    assert.equal(await page.locator('#printPeriodInterpretation').innerText(),await page.locator('#periodInterpretation').innerText());
                    assert.equal(await page.locator('#printSummaryRows tr').count(),6);
                    assert.equal(await page.locator('#clinicalPrintButton').isEnabled(),true);
                    checked++;
                  }
                }
                assert.equal(checked,33);
                console.log('KIMSE_CLINICAL_11_INSTITUTIONS_X_3_PERIODS_OK='+checked);
              }
              await page.locator('#period').selectOption('7');
              assert.equal(await page.locator('#periodInterpretation').getAttribute('data-selected-period-days'),'7');
              assert.match(await page.locator('#periodInterpretation').innerText(),/최근 7일.*전체 28일.*재산출값이 아닙니다/);
              assert.equal(await page.locator('#printPeriodInterpretation').innerText(),await page.locator('#periodInterpretation').innerText(),'screen and printed time scope must agree');
              assert.equal(await page.locator('#rawMetricRows tr').count(),6);
              assert.match(await page.locator('#rawMetricRows').innerText(),/7일/);
              await page.locator('[data-clinical-focus="0"]').click();
              assert.match(await page.locator('#selectionStatus').innerText(),/걸음수/,'table to chart focus did not work');
              // Capture the default compact provider view; expanded evidence is already
              // independently exercised through keyboard Enter earlier in this scenario.
              await page.locator('#institutionEvidenceDisclosure').evaluate(el=>{el.open=false;});
              await page.locator('.table-responsive').evaluateAll(tables=>tables.forEach(el=>{el.scrollLeft=0;}));
              const overflow=await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,innerWidth:window.innerWidth,
                offenders:Array.from(document.querySelectorAll('body *')).filter(el=>{
                  const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
                  return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.right>innerWidth+2&&r.left<innerWidth;
                }).slice(0,14).map(el=>({tag:el.tagName,id:el.id,cls:String(el.className).slice(0,90),text:el.innerText?.slice(0,75),right:Math.round(el.getBoundingClientRect().right)}))
              }));
              if(overflow.scrollWidth>overflow.innerWidth+2)console.log('KIMSE_HORIZONTAL_OVERFLOW_DEBUG='+name+' '+JSON.stringify(overflow));
              await page.screenshot({path:'clinical-template-qa/'+name+'.png',fullPage:true});
              assert.ok(overflow.scrollWidth<=overflow.innerWidth+2,'horizontal clipping '+name);

              await ctx.close();
              console.log('KIMSE_TEMPLATE_SCREEN_PASS='+name);
            }
            await browser.close();
            assert.deepEqual(issues,[]);
            console.log('KIMSE_LICENSED_CLINICAL_TEMPLATE_BROWSER_OK=yes');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node test-template-browser.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-licensed-clinical-template-qa
          path: clinical-template-qa/*.png
          if-no-files-found: ignore
