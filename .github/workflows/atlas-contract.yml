name: KIMSE Global Research Atlas QA
on:
  push:
    branches: [main]
    paths:
      - 'evidence/rd-world-map.js'
      - 'evidence/rd-world-map.css'
      - 'evidence/rd-world-map-data.json'
      - 'evidence/evidence-application-tabs.js'
      - 'evidence/rd.html'
      - 'evidence/tests/atlas-contract.test.cjs'
      - 'evidence/tests/atlas-browser.test.cjs'
      - '.github/workflows/atlas-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-map-acceptance:
    name: Public Evidence Atlas integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static app and 249-market data contract
        run: node evidence/tests/atlas-contract.test.cjs
      - name: Live page status (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kimse.suaveforge.com/evidence/rd.html"
          echo "HTTP live document: $URL"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 45 "$URL" -o /tmp/rd-live.html
          grep -q 'rd-world-map.js' /tmp/rd-live.html
          echo 'Live HTML contains Atlas loader'
          for asset in rd-world-map.js rd-world-map.css rd-world-map-data.json; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 45 "https://kimse.suaveforge.com/evidence/$asset" -o "/tmp/$asset"
          done
          node -e "const j=require('/tmp/rd-world-map-data.json'); if(j.total!==92 || j.iso31661Master.length!==249) process.exit(1); console.log('Live map JSON contract PASS')"

  browser-map-integration:
    name: Real Chromium map / mobile / country drilldown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser and deterministic local map fixtures
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 d3@7.9.0 topojson-client@3.1.0 world-atlas@2 @tabler/core@1.5.1
          npx playwright install --with-deps chromium
      - name: Serve public Pages branch locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kimse-atlas-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/evidence/rd.html > /dev/null
      - name: Browser screenshot and interactive map assertions
        run: node evidence/tests/atlas-browser.test.cjs
      - name: Preserve desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-global-atlas-browser-qa
          path: evidence/test-results/*.png
          if-no-files-found: warn
          retention-days: 14

  live-pages-release:
    name: Live published R&D Atlas HTTP contract
    needs: static-map-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for independent GitHub Pages deployment
        run: sleep 45
      - name: Verify published HTML, JS, CSS and map records
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://kimse.suaveforge.com/evidence"
          mkdir -p /tmp/kimse-atlas-live
          for asset in rd.html rd-world-map.js rd-world-map.css rd-world-map-data.json; do
            echo "Checking production $asset"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 15 \
              --connect-timeout 15 --max-time 45 \
              "$BASE/$asset?qa=$GITHUB_SHA" -o "/tmp/kimse-atlas-live/$asset"
          done
          expected="$(grep -oE 'v=2026[[:alnum:]-]+' evidence/rd.html | head -n 1)"
          test -n "$expected"
          grep -q "$expected" /tmp/kimse-atlas-live/rd.html
          grep -q 'centerMapViewport' /tmp/kimse-atlas-live/rd-world-map.js
          grep -q 'countries-50m.json' /tmp/kimse-atlas-live/rd-world-map.js
          grep -q 'kimse-atlas-grid' /tmp/kimse-atlas-live/rd-world-map.css
          node -e "const j=require('/tmp/kimse-atlas-live/rd-world-map-data.json');if(j.total!==92||j.iso31661Master.length!==249||j.institutions.length!==92)process.exit(1);console.log('LIVE Atlas JSON PASS')"
          echo "LIVE HTTP + asset content checks PASS"
