name: Temporary cross-repo org runner validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-org-runners-crossrepo-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux, X64, server123, suaveforge-deploy, suaveforge-org]
    timeout-minutes: 3
    steps:
      - name: Report runner
        shell: bash
        run: |
          echo "slot=${{ matrix.slot }}"
          echo "runner_name=$RUNNER_NAME"
          echo "repo=$GITHUB_REPOSITORY"
          sleep 10
