name: KIMSE Quiet Signal Senior Journey Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/quiet-signal-journey-qa.cjs'
      - '.github/workflows/quiet-signal-journey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public Quiet Signal release
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 15 'https://kimse.suaveforge.com/senior-journey.css?qa=quiet-signal-60' -o /tmp/quiet-signal.css &&
               curl -fsSL --max-time 15 'https://kimse.suaveforge.com/app.js?qa=quiet-signal-60' -o /tmp/quiet-signal.js &&
               grep -Fq 'Quiet Signal' /tmp/quiet-signal.css &&
               grep -Fq 'kimse-voice-journey kimse-journey' /tmp/quiet-signal.js; then
                echo 'KIMSE_QUIET_SIGNAL_LIVE=yes';exit 0
            fi
            sleep 10
          done
          echo 'KIMSE_QUIET_SIGNAL_LIVE=no';exit 1
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kimse-quiet-signal-qa" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/kimse-quiet-signal-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate 4 screens 6 widths 3 accessibility modes
        run: node tests/quiet-signal-journey-qa.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-quiet-signal-browser-results
          path: qa-artifacts/
          if-no-files-found: ignore
