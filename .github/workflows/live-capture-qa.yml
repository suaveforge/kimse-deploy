name: KIMSE Live Capture QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-capture-qa.yml'
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'capture-polish.css'
      - 'accessibility-enhancements.css'
      - 'accessibility-enhancements.js'
      - 'premium-ux.css'
      - 'premium-ux.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'assets/**'

permissions:
  contents: read

jobs:
  live-capture-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Allow Pages to settle
        run: sleep 25
      - name: Install Playwright Chromium
        run: |
          npm install playwright --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Verify live app and record actual tour
        run: |
          mkdir -p artifacts/screens artifacts/video artifacts/frames
          cat > /tmp/kimse-live-qa.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs'),path=require('path');
          const BASE='https://kimse.suaveforge.com/',OUT=path.resolve('artifacts');
          const log={base:BASE,startedAt:new Date().toISOString(),checks:[],timeline:[],errors:[]};
          const check=(v,n,d='')=>{log.checks.push({name:n,ok:!!v,detail:d});if(!v)throw Error(n+': '+d);console.log('PASS',n,d)};
          const save=()=>fs.writeFileSync(path.join(OUT,'live-qa.json'),JSON.stringify(log,null,2));
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const qa=await browser.newContext({viewport:{width:450,height:800},deviceScaleFactor:1}),p=await qa.newPage(),req=qa.request;
            const names=['','app.js','service-worker.js','manifest.webmanifest','assets/icons/icon.svg','capture-polish.css','accessibility-enhancements.css','accessibility-enhancements.js','premium-ux.css','premium-ux.js'];
            const rs=await Promise.all(names.map(x=>req.get(BASE+x,{timeout:20000})));rs.forEach((r,i)=>check(r.ok(),'live-http-'+(names[i]||'root'),String(r.status())));
            const [html,js,sw,manifest,icon,polish,a11yCss,a11yJs,premiumCss,premiumJs]=await Promise.all(rs.map(r=>r.text()));
            check(!html.includes('localize-switcher')&&!html.includes('localizehub-runtime'),'main-app-localize-removed');
            check(!js.includes('<localize-switcher'),'main-js-localize-removed');
            check(sw.includes('release39')&&sw.includes('capture-polish.css')&&sw.includes('accessibility-enhancements.css')&&sw.includes('accessibility-enhancements.js')&&sw.includes('premium-ux.css')&&sw.includes('premium-ux.js')&&!sw.includes('localizehub-runtime'),'release39-cache-live');
            check(manifest.includes('icon.svg')&&manifest.includes('icon-maskable-source.svg'),'manifest-icons-live');
            check(icon.includes('#FF6E68')&&icon.includes('#0F4553')&&icon.includes('M303 659'),'redesigned-icon-live');
            check(polish.includes('.screen-brain-trends')&&polish.includes('top:12px'),'caption-safe-zone-live');
            check(a11yCss.includes('.a11y-only')&&a11yCss.includes('.user-reduced-motion')&&a11yCss.includes('.large-text .screen-monitoring-status'),'a11y-css-live');
            check(a11yJs.includes('ALWAYS_ON_KEYS')&&a11yJs.includes('monitoring-a11y-summary')&&a11yJs.includes('brain-trends-a11y-summary')&&a11yJs.includes("svg.setAttribute('aria-describedby',summary.id)"),'a11y-js-live');
            check(premiumCss.includes('Release 39 · premium universal UX')&&premiumCss.includes('.monitoring-journey')&&premiumCss.includes('.brain-map-stage'),'premium-ux-css-live');
            check(premiumJs.includes("const VERSION='39'")&&premiumJs.includes('monitoring-journey')&&premiumJs.includes('trend-chart-legend'),'premium-ux-live');
            await p.route('https://api-kimse.suaveforge.com/**',r=>r.abort('failed'));
            await p.goto(BASE+'#/consent',{waitUntil:'domcontentloaded',timeout:30000});
            await p.evaluate(()=>localStorage.setItem('kimse.p0.state',JSON.stringify({version:9,account:{name:'실화면 QA',email:'qa@example.com'},intent:'self',self:true,care:true,mode:'self',caregivers:[{name:'가족 보호자',relation:'자녀'}],onboarding:{profileDone:true,initialDone:true,consentDone:false,completed:false},initial:{step:5,answers:{attention:'10',language:'과일',spatial:'no',daily:'no'},responseTimes:[],recall:'나무 기차 우산',voiceSamples:[],voiceSkipped:true,completedAt:new Date().toISOString(),domains:{memory:86,executive:84,language:87,spatial:85,daily:88}},consents:{service:false,privacy:false,health:false,microphone:false,location:false,motion:false,usage:false,notifications:false,caregiverShare:true},baseline:{startedAt:null},permissions:{microphone:'unknown',location:'unknown',motion:'unknown',notifications:'unknown'},monitoring:{pending:[],summary:{status:'READY',baseline_days:14,baseline_target_days:14,level:'ATTENTION',changes:[{metric:'sleep_minutes',baseline:425,recent:336,relative_change:-0.2094,changed:true},{metric:'steps',baseline:5120,recent:3460,relative_change:-0.3242,changed:true},{metric:'voice_pause_ratio',baseline:0.18,recent:0.23,relative_change:0.2778,changed:true}],metrics:[],interpretation:'현재 결과는 변화 관찰을 위한 참고 정보이며 치매 진단을 의미하지 않습니다.'},alerts:[],lastFlushAt:null,lastSyncError:'',initialSignalsQueued:false},brainHistory:[{at:'2026-09-15T09:00:00+09:00',memory:86,executive:84,language:87,spatial:85,daily:88},{at:'2026-09-16T09:00:00+09:00',memory:84,executive:82,language:84,spatial:84,daily:87},{at:'2026-09-17T09:00:00+09:00',memory:80,executive:79,language:80,spatial:83,daily:85,flag:'attention',flagLabel:'수면 감소 · 활동 감소 · 말할 때 멈춤 증가'}],a11y:{largeText:false,highContrast:false,voiceGuidance:false,soundEffects:true,captions:true,largeTouchTargets:false,colorIcons:true,screenReader:true,reduceMotion:false}})));
            await p.reload({waitUntil:'domcontentloaded'});await p.waitForSelector('#consent-form',{timeout:15000});
            check(await p.locator('localize-switcher').count()===0,'no-localize-live-dom');
            await p.screenshot({path:path.join(OUT,'screens','01-consent.png')});
            for(const id of ['#consent-service','#consent-privacy','#consent-health'])await p.check(id);
            for(const id of ['#consent-microphone','#consent-location','#consent-motion','#consent-usage','#consent-notifications','#consent-caregiver'])if(await p.locator(id).isChecked())await p.uncheck(id);
            await p.locator('#consent-form button[type="submit"]').click();await p.waitForFunction(()=>location.hash==='#/home',null,{timeout:15000});
            const ht=await p.locator('#app').innerText();check(ht.includes('생활패턴 확인 중')&&ht.includes('오늘은 1/14일째예요'),'consent-home-day1');
            await p.getByRole('button',{name:'14일 진행 보기'}).click();await p.waitForFunction(()=>location.hash==='#/baseline');
            check((await p.locator('.baseline-calendar-leaf strong').innerText()).trim()==='1','baseline-start-day1');
            check(!(await p.locator('#app').innerText()).includes('14일 확인 완료'),'day14-not-preexposed');

            await p.goto(BASE+'#/accessibility',{waitUntil:'domcontentloaded'});await p.waitForSelector('.screen-accessibility',{timeout:15000});await p.waitForTimeout(100);
            check(await p.locator('input[data-a11y="captions"],input[data-a11y="colorIcons"],input[data-a11y="screenReader"]').count()===0,'no-fake-always-on-a11y-toggles');
            check(await p.locator('input[data-a11y="largeText"]').count()===1&&await p.locator('input[data-a11y="highContrast"]').count()===1&&await p.locator('input[data-a11y="largeTouchTargets"]').count()===1&&await p.locator('input[data-a11y="reduceMotion"]').count()===1,'real-a11y-controls-visible');
            check(await p.locator('.accessibility-basics').count()===1,'always-on-a11y-basics-visible');
            await p.screenshot({path:path.join(OUT,'screens','02-accessibility.png'),fullPage:true});
            await p.locator('input[data-a11y="largeText"]').check();await p.waitForTimeout(50);
            await p.locator('input[data-a11y="highContrast"]').check();await p.waitForTimeout(50);
            await p.locator('input[data-a11y="reduceMotion"]').check();await p.waitForTimeout(100);
            check(await p.evaluate(()=>document.documentElement.classList.contains('large-text')),'large-text-applied-live');
            check(await p.evaluate(()=>document.documentElement.classList.contains('high-contrast')),'high-contrast-applied-live');
            check(await p.evaluate(()=>document.documentElement.classList.contains('user-reduced-motion')),'user-reduced-motion-applied-live');
            await p.screenshot({path:path.join(OUT,'screens','02b-accessibility-large-highcontrast.png'),fullPage:true});
            await p.keyboard.press('Tab');
            check(await p.evaluate(()=>document.activeElement&&document.activeElement!==document.body),'keyboard-focus-reachable');

            await p.goto(BASE+'#/monitoring-status',{waitUntil:'domcontentloaded'});await p.waitForSelector('.screen-monitoring-status',{timeout:15000});await p.waitForTimeout(100);
            check(await p.locator('#monitoring-a11y-summary').count()===1,'monitoring-semantic-summary');
            check((await p.locator('#monitoring-a11y-summary').innerText()).length>40,'monitoring-semantic-summary-content');
            check(await p.locator('.result-change').count()===3,'monitoring-three-changes-present');
            check(await p.locator('.result-change[aria-label]').count()===3,'monitoring-noncolor-change-labels');
            await p.screenshot({path:path.join(OUT,'screens','03-monitoring-large-highcontrast.png'),fullPage:true});

            await p.goto(BASE+'#/brain-trends',{waitUntil:'domcontentloaded'});await p.waitForSelector('.screen-brain-trends',{timeout:15000});await p.waitForTimeout(100);
            check(await p.locator('#brain-trends-a11y-summary').count()===1,'brain-trends-semantic-summary');
            check(await p.locator('.overall-trend').count()>=1,'brain-trends-chart-present');
            check(await p.locator('.overall-trend[aria-describedby="brain-trends-a11y-summary"]').count()>=1,'brain-trends-chart-linked-summary');
            await p.screenshot({path:path.join(OUT,'screens','04-brain-trends-large-highcontrast.png'),fullPage:true});
            await qa.close();

            const rec=await browser.newContext({viewport:{width:450,height:800},deviceScaleFactor:1,recordVideo:{dir:path.join(OUT,'video'),size:{width:450,height:800}}}),v=await rec.newPage();
            await v.goto(BASE+'?capture=1#/demo-capture',{waitUntil:'domcontentloaded',timeout:30000});await v.waitForSelector('#demo-preview',{timeout:15000});await v.evaluate(()=>document.documentElement.classList.add('capture-frame-mode'));
            const video=v.video();let stop=false,busy=false,last='',shot=10;
            const timer=setInterval(async()=>{if(stop||busy)return;busy=true;try{const s=await v.evaluate(()=>({hash:location.hash,caption:document.querySelector('#app')?.dataset?.captureCaption||'',day:document.querySelector('.baseline-calendar-leaf strong')?.textContent?.trim()||'',milestone:document.querySelector('.baseline-milestone-card strong')?.textContent?.trim()||'',attention:document.querySelector('.trend-attention-note small')?.textContent?.trim()||'',captionTop:getComputedStyle(document.querySelector('#app'),'::before').top,trendLinked:!!document.querySelector('.overall-trend[aria-describedby="brain-trends-a11y-summary"]')}));log.timeline.push({t:Date.now(),...s});if(s.hash!==last||s.day==='7'||s.day==='14'){await v.screenshot({path:path.join(OUT,'screens',String(shot++).padStart(2,'0')+'-'+(s.hash.replace('#/','')||'root')+(s.day?'-day'+s.day:'')+'.png')});last=s.hash}}catch(e){log.errors.push(String(e))}finally{busy=false}},250);
            await v.locator('#demo-preview').click();await v.waitForFunction(()=>location.hash!=='#/demo-capture',null,{timeout:8000});await v.waitForFunction(()=>location.hash==='#/demo-capture',null,{timeout:100000});await v.waitForTimeout(1000);stop=true;clearInterval(timer);while(busy)await v.waitForTimeout(50);
            const caps=[...new Set(log.timeline.map(x=>x.caption).filter(Boolean))],days=[...new Set(log.timeline.filter(x=>x.hash==='#/baseline').map(x=>Number(x.day)).filter(Number.isFinite))];
            check(caps.length>=8,'captions-rendered',caps.join(' | '));check(days[0]===1&&days.includes(7)&&days.includes(14)&&days.length>=12,'day1-to-day14',days.join(','));
            check(log.timeline.some(x=>x.day==='7'&&x.milestone.includes('첫 주 패턴 확인')),'day7-event');check(log.timeline.some(x=>x.day==='14'&&x.milestone.includes('14일 확인 완료')),'day14-event');
            check(log.timeline.some(x=>x.hash==='#/brain-trends'&&x.attention.includes('수면 감소')&&x.attention.includes('활동 감소')&&x.attention.includes('말할 때 멈춤 증가')),'trend-attention-note');
            check(log.timeline.some(x=>x.hash==='#/brain-trends'&&x.trendLinked),'capture-brain-trends-semantic-link');
            check(log.timeline.some(x=>['#/brain-map','#/brain-trends'].includes(x.hash)&&x.caption&&parseFloat(x.captionTop)<=20),'dense-caption-safe-zone');
            await rec.close();fs.copyFileSync(await video.path(),path.join(OUT,'kimse-live-tour.webm'));log.captions=caps;log.days=days;log.finishedAt=new Date().toISOString();save();
          }finally{await browser.close()}})().catch(e=>{log.errors.push(String(e.stack||e));save();console.error(e);process.exit(1)});
          NODE
          node /tmp/kimse-live-qa.cjs
      - name: Extract frames from actual WEBM
        if: always()
        run: |
          if [ -f artifacts/kimse-live-tour.webm ]; then
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json artifacts/kimse-live-tour.webm > artifacts/video-probe.json || true
            ffmpeg -hide_banner -loglevel error -y -i artifacts/kimse-live-tour.webm -vf fps=1 artifacts/frames/frame-%03d.jpg || true
          fi
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimse-live-capture-qa
          path: artifacts
          if-no-files-found: error
          retention-days: 7
