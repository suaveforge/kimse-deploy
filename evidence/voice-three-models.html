#korean-panel .exam-more-research summary{display:block;min-height:38px;font-size:14px;line-height:38px;text-align:center;cursor:pointer;color:#c1ddd2}
#korean-panel #exam-more[open]{overflow-y:auto;max-height:36dvh;border:1px solid #376e62;border-radius:12px;padding:6px 12px;background:#0c413b}
#korean-panel .exam-summary,#korean-panel #exam-research-status{color:#d5ede4;font-size:15px}
#korean-panel #exam-research-result{color:#23473c}
#korean-panel #exam-research-result p{color:#526d63}
#korean-panel #exam-restart{flex:none;align-self:stretch;min-height:58px;margin-top:8px;padding:10px 18px;background:#b1ead8;color:#12453a;border:0;border-radius:16px;font-size:20px;font-weight:800}
#korean-panel [hidden]{display:none!important}
@media(max-height:660px){#korean-panel .exam-card{padding-top:calc(env(safe-area-inset-top,0px) + 9px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}#korean-panel .exam-topbar{margin-bottom:3px}#korean-panel .exam-question{font-size:clamp(25px,5.8vw,40px);margin:8px 0}#korean-panel .exam-meter-wrap canvas{height:40px}#korean-panel .exam-button{min-height:58px}#korean-panel .exam-consent-step{gap:12px}}
@media(prefers-reduced-motion:reduce){#korean-panel .exam-recording-indicator:before{animation:none}}

/* Reused unchanged from voice-analysis-beta.html: uninterrupted, user-controlled
 * full-screen focus transition. Never force-advance after a timer. */
.voice-transition{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:radial-gradient(ellipse at 45% 40%,#164953,#06252c);color:#f5fffb;cursor:pointer;text-align:center;min-height:100dvh;grid-template-rows:1fr auto;align-items:stretch;justify-items:stretch;padding:clamp(20px,5vw,60px)}
.voice-transition[hidden]{display:none!important}
.voice-transition__center{display:grid;place-items:center;height:100%}
.voice-transition__message{font-size:clamp(40px,8vw,95px);max-width:1000px;line-height:1.28;font-weight:870;letter-spacing:-.05em;word-break:keep-all;animation:calm-voice 3.4s ease-in-out infinite}
.voice-transition__hint{justify-self:center;margin:0 0 max(20px,3vh);font-size:clamp(18px,3vw,28px);border:1px solid #539b98;padding:16px 25px;border-radius:999px;color:#d3fff7;animation:calm-hint 3.1s ease-in-out infinite}
@keyframes calm-voice{0%,100%{opacity:.74;transform:scale(.989)}50%{opacity:1;transform:scale(1.009)}}
@keyframes calm-hint{0%,100%{opacity:.68}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.voice-transition__message,.voice-transition__hint{animation:none}}
</style></head><body><main>
<section id="korean-panel" class="panel" aria-label="AI 음성 비교">
<div class="exam-card" id="top3-card" data-phase="consent">
  <div class="exam-topbar"><strong>낌새</strong><div><a class="exam-toplink" href="./">나가기</a></div></div>
  <section class="exam-consent-step" id="top3-consent">
    <strong>AI 음성 비교</strong>
    <p>최근 기억에 남는 일을<br>편하게 이야기해 주세요.</p>
    <label class="exam-consent"><input id="consent" type="checkbox"><span>음성을 AI 모델 3개로 분석하는 데 동의합니다. 음성은 저장하지 않습니다.</span></label>
  </section>
  <div class="exam-head" id="top3-head" hidden><span>말하기 검사</span><span>01 / 01</span></div>
  <p class="exam-question" id="top3-question" hidden>최근 기억에 남는 일을 이야기해 주세요.</p>
  <div class="exam-center" id="top3-center" hidden><div class="exam-clock" id="clock" aria-live="polite">00:00</div></div>
  <section class="exam-finished" id="top3-finished" hidden aria-live="polite">
    <h3>AI 비교 결과</h3>
    <div class="model-grid" id="top3-results"></div>
    <p class="visually-hidden">연구용 모델의 원시 학습 분류입니다. 한국어 판별 정확도는 검증 중입니다.</p>
  </section>
  <button type="button" class="exam-button" id="rec" disabled>AI 연결 확인 중</button>
  <p class="exam-status" id="recState" role="status" aria-live="polite" data-state="error">AI 연결 확인 중입니다.</p>
</div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const url=location.hostname==='kimse.suaveforge.com'
  ? 'https://api-kimse.suaveforge.com:18467/api/v1/evidence/voice-analysis/top3-lab'
  : '/api/v1/evidence/voice-analysis/top3-lab';
const models=[['parim1','parim1'],['auralis','Auralis'],['mmcnair','MMcnair']];
let phase='consent',ready=false,busy=false,recorder=null,stream=null,chunks=[],timer=null,started=0;
function state(msg,error=false){
 $('recState').textContent=msg;
 $('recState').dataset.state=error?'error':'ok';
}
function screen(next){
 phase=next;$('top3-card').dataset.phase=next;
 $('top3-consent').hidden=next!=='consent';
 $('top3-head').hidden=!['recording','processing'].includes(next);
 $('top3-question').hidden=!['recording','processing'].includes(next);
 $('top3-center').hidden=!['recording','processing'].includes(next);
 $('top3-finished').hidden=next!=='done';
 const action=$('rec');
 if(next==='consent'){action.textContent=ready?'녹음 시작':'AI 연결 확인 중';action.disabled=!ready||!$('consent').checked}
 if(next==='recording'){action.textContent='녹음 끝내기';action.disabled=false}
 if(next==='processing'){action.textContent='AI 분석 중';action.disabled=true;$('top3-question').textContent='AI가 음성을 비교하고 있습니다.'}
 if(next==='done'){action.textContent='다시 검사';action.disabled=false}
}
function cleanup(){
 if(timer!==null)clearInterval(timer);timer=null;
 if(recorder?.state==='recording')try{recorder.stop()}catch{}
 stream?.getTracks().forEach(t=>t.stop());
 recorder=null;stream=null;chunks=[];
}
function tick(){
 if(phase!=='recording')return;
 const s=Math.floor((performance.now()-started)/1000);
 $('clock').textContent='00:'+String(Math.min(20,s)).padStart(2,'0');
 if(s>=19)stop();
}
function stop(){
 if(phase!=='recording'||!recorder)return;
 $('rec').disabled=true;state('녹음 확인 중…',true);
 if(recorder.state==='recording')recorder.stop();
}
$('consent').addEventListener('change',()=>{if(phase==='consent')screen('consent')});
$('rec').addEventListener('click',()=>{
 if(phase==='consent')void start();
 else if(phase==='recording')stop();
 else if(phase==='done')reset();
});
async function start(){
 if(phase!=='consent'||!ready||busy||!$('consent').checked)return;
 $('rec').disabled=true;state('마이크 연결 중…',true);
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder||!window.OfflineAudioContext)
   throw Error('UNSUPPORTED_RECORDING');
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recorder=new MediaRecorder(stream);chunks=[];
  const current=recorder;
  current.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  current.onerror=()=>{cleanup();screen('consent');state('녹음 실패. 다시 시작해 주세요.',true)};
  current.onstop=async()=>{
   if(timer!==null)clearInterval(timer);timer=null;
   stream?.getTracks().forEach(t=>t.stop());stream=null;
   const blob=new Blob(chunks,{type:current.mimeType||'audio/webm'});
   recorder=null;chunks=[];
   if(phase!=='recording')return;
   screen('processing');$('clock').textContent='···';state('');
   try{const wav=await makeWav(blob);await analyze(wav)}
   catch(e){screen('consent');state(e.message||'다시 녹음해 주세요.',true)}
  };
  current.start(300);started=performance.now();
  $('top3-question').textContent='최근 기억에 남는 일을 이야기해 주세요.';
  $('clock').textContent='00:00';screen('recording');state('');
  timer=setInterval(tick,250);
 }catch{
  cleanup();screen('consent');state('마이크 권한을 확인한 후 다시 시작해 주세요.',true);
 }
}
async function makeWav(blob){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 let decoded;try{decoded=await ctx.decodeAudioData(await blob.arrayBuffer())}finally{ctx.close().catch(()=>{})}
 const n=Math.min(Math.floor(decoded.duration*16000),20*16000);
 if(n<3*16000||n>20*16000)throw Error('3~20초로 다시 녹음하세요.');
 const offline=new OfflineAudioContext(1,n,16000);
 const source=offline.createBufferSource();source.buffer=decoded;source.connect(offline.destination);source.start();
 const samples=(await offline.startRendering()).getChannelData(0);
 const view=new DataView(new ArrayBuffer(44+samples.length*2));
 function txt(at,s){for(let i=0;i<s.length;i++)view.setUint8(at+i,s.charCodeAt(i))}
 txt(0,'RIFF');view.setUint32(4,36+samples.length*2,true);txt(8,'WAVE');txt(12,'fmt ');
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);
 view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
 txt(36,'data');view.setUint32(40,samples.length*2,true);
 for(let i=0;i<samples.length;i++){let v=Math.max(-1,Math.min(1,samples[i]));view.setInt16(44+i*2,v<0?v*32768:v*32767,true)}
 const bytes=new Uint8Array(view.buffer);let output='';for(let i=0;i<bytes.length;i+=8192)output+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(output);
}

async function analyze(wav){
 if(busy)return;busy=true;
 screen('processing');state('');
 const results=[];
 for(let i=0;i<models.length;i++){
  const [model,name]=models[i];
  $('clock').textContent=String(i+1)+' / 3';
  try{
   const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),155000);
   let response;
   try{
    response=await fetch(url+'/classify',{
      method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({model,audio_base64:wav,consent_research_audio_processing:true})
    });
   }finally{clearTimeout(timeout)}
   const data=await response.json().catch(()=>({}));
   if(!response.ok||data.status!=='classified_research_only'||data.model!==model||
    data.checkpointVerified!==true||data.weightTensorCount!==426||data.audioStored!==false||
    data.koreanClinicalAccuracyVerified!==false||
    !['dementia','nodementia'].includes(data.trainingClass))throw Error('INVALID_MODEL_RESPONSE');
   results.push({name,value:data.trainingClass==='dementia'?'치매 패턴':'비치매 패턴'});
  }catch{results.push({name,value:'분석 실패'})}
 }
 wav='';busy=false;
 const list=$('top3-results');list.replaceChildren();
 for(const result of results){
  const card=document.createElement('article');card.className='model-choice';
  const name=document.createElement('strong');name.textContent=result.name;
  const wrapper=document.createElement('div');wrapper.className='exam-intro';
  const value=document.createElement('h1');value.setAttribute('role','none');value.textContent=result.value;
  wrapper.append(value);card.append(name,wrapper);list.append(card);
 }
 screen('done');state('');
}
function reset(){
 cleanup();busy=false;$('consent').checked=false;
 $('clock').textContent='00:00';$('top3-results').replaceChildren();
 screen('consent');state('');
}
async function checkConnection(){
 state('AI 연결 확인 중입니다.',true);
 try{
  const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),12000);
  let response;
  try{response=await fetch(url+'/status',{cache:'no-store',signal:ctrl.signal})}
  finally{clearTimeout(timeout)}
  const data=await response.json();
  if(!response.ok||data.ready!==true||
     data.models?.parim1!==true||data.models?.auralis!==true||data.models?.mmcnair!==true)
     throw Error('MODEL_NOT_READY');
  ready=true;screen('consent');state('');
 }catch{
  ready=false;screen('consent');state('AI 연결이 되지 않았습니다. 새로고침해 주세요.',true);
 }
}
screen('consent');void checkConnection();
</script></body></html>
