<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="낌새 촬영용 시연 화면. 이미지 속 수치는 실제 검사 결과가 아닌 예시 데이터입니다.">
  <title>낌새 | 촬영용 분석 결과 예시</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    main { width: 100vw; height: 100vh; height: 100dvh; display: grid; place-items: center; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; user-select: none; }
  </style>
</head>
<body>
  <main aria-label="낌새 촬영용 분석 결과 예시 화면. 사진 속 수치는 가상 데이터입니다.">
    <img src="./capture-photo.png" width="1672" height="941" draggable="false" alt="낌새 치매와 비치매 분석 결과를 보여주는 노트북 화면의 촬영용 시연 사진">
  </main>
</body>
</html>
