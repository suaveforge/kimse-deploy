<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5faf8">
<meta name="description" content="MediaPipe 비전 모델을 이용한 눈 감김 측정 체험. 영상은 기기에서 처리됩니다.">
<title>눈 감김 테스트 · 낌새 AI</title>
<style>
:root{--ink:#183a42;--sub:#537079;--brand:#087d70;--line:#d7e6e1;--bg:#f5faf8;--danger:#a45124}
*{box-sizing:border-box}html,body{margin:0;min-width:320px}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.35}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #5ec6ac;outline-offset:3px}
header{height:46px;background:white;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}header a{color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:750}header span{color:var(--sub);font-size:.75rem;font-weight:750}
main{max-width:760px;margin:auto;padding:10px 14px max(8px,env(safe-area-inset-bottom));height:calc(100vh - 46px);height:calc(100dvh - 46px);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}.heading h1{font-size:clamp(1.05rem,2.7vw,1.42rem);font-weight:850;letter-spacing:-.04em;line-height:1.3;margin:0}.pill{font-size:.72rem;border:1px solid #b8d9ce;color:#117363;background:#eaf7f2;border-radius:20px;padding:4px 9px;white-space:nowrap;font-weight:750}
.visual{position:relative;flex:1 1 260px;min-height:150px;max-height:550px;overflow:hidden;border-radius:15px;background:radial-gradient(ellipse at center,#2a5660,#142b33);color:#fff;border:1px solid #24444b;display:flex;align-items:center;justify-content:center;isolation:isolate}
.visual video,.visual canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.visual canvas{pointer-events:none}
.placeholder{position:relative;z-index:1;padding:12px;text-align:center;color:#d4e8e5;font-size:.89rem;display:grid;gap:8px;justify-items:center}
.placeholder .camera-symbol{display:grid;place-items:center;width:62px;height:62px;border:2px solid #84cbbc;border-radius:20px;color:#b8f0e1;font-size:1.75rem}
.visual[data-active="true"] .placeholder{display:none}
.status{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;background:rgba(8,29,35,.84);color:white;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;pointer-events:none}
.status[data-level="alert"]{background:rgba(112,44,17,.95)}.status strong{font-size:.91rem;line-height:1.3}.status span{font-size:.77rem;line-height:1.3;color:#e1f1ed;overflow-wrap:anywhere}
.controls{flex:none;display:flex;gap:7px;align-items:center;min-height:43px}.controls button{border-radius:10px;border:1px solid #bed6cd;background:white;color:#206c62;padding:10px 13px;font-size:.84rem;font-weight:800;min-height:42px;white-space:nowrap}.controls button.primary{background:var(--brand);border-color:var(--brand);color:#fff;flex:1 1 120px}.controls label{display:flex;align-items:center;gap:5px;margin-left:auto;font-weight:700;color:#41636a;white-space:nowrap;font-size:.82rem}.controls input{width:17px;height:17px;accent-color:var(--brand)}
.metrics{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.metric{min-width:0;background:white;border:1px solid var(--line);border-radius:11px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:55px}.metric small{font-size:.75rem;font-weight:700;color:var(--sub);line-height:1.22}.metric strong{font-size:1.17rem;letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.footnote{flex:none;color:#54737a;font-size:.7rem;line-height:1.3;text-align:center;white-space:normal;margin:0}.engine-version{display:none}
@media(min-width:760px){main{gap:10px;padding-top:16px}.visual{border-radius:19px}.heading h1{font-size:1.4rem}.metric{min-height:61px}.metrics{gap:10px}.controls button{font-size:.92rem}}
@media(max-height:670px){main{gap:6px;padding-top:7px;padding-bottom:5px}.metric{min-height:48px;padding:6px 10px}.controls{min-height:38px}.controls button{min-height:37px;padding:8px 10px}.visual{min-height:125px}.status{padding:5px 9px}.placeholder .camera-symbol{width:46px;height:46px;font-size:1.4rem;border-radius:14px}.footnote{font-size:.66rem}}
@media(max-height:500px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{display:grid;gap:1px;padding:5px}.metric strong{font-size:.94rem}.visual{min-height:100px}.pill{display:none}}
</style>
</head>
<body>
<header><a href="./collection.html?view=ai">← AI 기술 목록</a><span>낌새 Evidence</span></header>
<main>
<div class="heading"><h1>눈 감김 분석 테스트</h1><span class="pill">비전 AI 체험</span></div>
<section class="visual" id="visual" data-active="false" aria-label="실시간 카메라">
<video id="camera" playsinline webkit-playsinline autoplay muted aria-label="카메라 영상"></video>
<canvas id="overlay" aria-hidden="true"></canvas>
<div class="placeholder"><div class="camera-symbol" aria-hidden="true">◎</div>카메라를 켜면 눈 감김 변화가 표시됩니다.</div>
<div class="status" id="status" data-level="waiting" role="status" aria-live="polite"><strong id="status-title">카메라 대기 중</strong><span id="status-detail">시작을 누르고 눈 뜨기·감기 보정을 진행하세요.</span></div>
</section>
<div class="controls">
<button type="button" class="primary" id="start">카메라 시작</button>
<button type="button" id="stop" disabled>중지</button>
<button type="button" id="sound-test">소리 확인</button>
<label title="눈 감김 감지음 설정"><input type="checkbox" id="sound-enabled" checked> 소리</label>
</div>
<div class="metrics" aria-label="실시간 측정값">
<div class="metric"><small>눈 개방률</small><strong id="blink">—</strong></div>
<div class="metric"><small>연속 감김</small><strong id="duration">—</strong></div>
<div class="metric"><small>60초 감김 비율</small><strong id="ratio">—</strong></div>
<div class="metric"><small>관측률</small><strong id="coverage">—</strong></div>
</div>
<p class="footnote">감김 시 소리 알림은 체험용입니다. 졸음 판정·운전 안전장치가 아닙니다. 영상은 저장되지 않습니다.</p>
<span id="events" hidden></span><span id="engine-version" class="engine-version"></span>
</main>
<script type="module" src="./drowsiness-demo.js?v=20261022-ios-audio5"></script>
</body>
</html>
