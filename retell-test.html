<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f4553">
<title>낌새 | AI 상담 통화 연결 테스트</title><link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#193f42;background:#f2f7f6}
*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100dvh;display:grid;place-items:center}
main{width:min(100%,480px);border:1px solid #d9e7e4;border-radius:20px;padding:22px;background:white}
h1{font-size:1.5rem;margin:5px 0 12px}p{color:#4c6366;line-height:1.65}
.kicker{font-size:.84rem;color:#34685f;font-weight:700}
.note{border-radius:12px;background:#f1f6f5;padding:12px;margin:15px 0;font-size:.9rem;line-height:1.6}
.warning{background:#fff3e5}
form{display:grid;gap:12px}label{display:block;font-size:.95rem;font-weight:650}
input[type=text]{display:block;width:100%;padding:13px;margin-top:6px;font:inherit;border:1px solid #a2bab4;border-radius:10px}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:500;line-height:1.5}
.check input{width:19px;height:19px;flex-shrink:0;margin-top:3px}
button{border:0;background:#0f5967;color:#fff;padding:14px;border-radius:11px;font-size:1rem;font-weight:700;min-height:48px;cursor:pointer}
button:disabled{opacity:.55}a{color:#135a68}#status{min-height:50px;font-size:.92rem}footer{font-size:.86rem;margin-top:20px}
</style></head><body><main>
<div class="kicker">KIMSE / 기술 검증 전용</div><h1>AI 상담 통화 테스트</h1>
<p>국내 전화번호 없이 브라우저에서 Retell 음성 상담원과 대화합니다. 기존 가족 통화 및 분석 기능은 변경하지 않습니다.</p>
<div class="note warning">실제 환자 정보, 연락처, 질병 이력은 말하지 마세요. 테스트 음성은 Retell에서 처리될 수 있습니다.</div>
<form id="retell-form">
<label>Retell Voice Public Key<input id="public-key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="public_key_... 또는 key_..." required></label>
<label>Voice Agent ID<input id="agent-id" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="agent_..." required></label>
<label class="check"><input id="consent" type="checkbox" required><span>테스트용 음성이 Retell에 전송되는 것에 동의합니다. 실제 민감정보는 사용하지 않습니다.</span></label>
<button id="connect" type="submit">웹 통화 연결</button>
</form>
<p id="status" role="status" aria-live="polite">공개용 키와 음성 상담원 ID를 입력해주세요.</p>
<div class="note">연결 뒤 Retell 통화창에서 시작하고 마이크를 허용하세요. <strong>낌새 분석 DB로의 음성·문답 전송은 아직 연결되지 않았습니다.</strong></div>
<footer><a href="/">낌새로 돌아가기</a> · <a href="https://docs.retellai.com/deploy/chat-widget" target="_blank" rel="noopener noreferrer">Retell 공식 가이드</a></footer>
</main>
<script>
(function(){
'use strict';
var form=document.getElementById('retell-form');
var status=document.getElementById('status');
var button=document.getElementById('connect');
function say(s){status.textContent=s;}
form.addEventListener('submit',function(e){
e.preventDefault();
if(document.getElementById('retell-widget')){say('이미 Retell 위젯을 불러왔습니다. 화면의 통화창을 확인해주세요.');return;}
var pk=document.getElementById('public-key').value.trim();
var id=document.getElementById('agent-id').value.trim();
if(!/^(public_key_|key_)[A-Za-z0-9_-]{5,}$/.test(pk)||!/^agent_[A-Za-z0-9_-]{5,}$/.test(id)){
 say('공개용 Voice Public Key와 Voice Agent ID를 확인해주세요. 비밀 API 키는 입력하지 마세요.');return;
}
if(!document.getElementById('consent').checked){say('먼저 테스트 동의가 필요합니다.');return;}
button.disabled=true;say('Retell 위젯을 불러오는 중입니다.');
var script=document.createElement('script');
script.id='retell-widget';script.type='module';
script.src='https://dashboard.retellai.com/retell-widget-v2.js';
script.setAttribute('data-voice-public-key',pk);
script.setAttribute('data-voice-agent-id',id);
script.setAttribute('data-title','낌새 AI 상담 테스트');
script.setAttribute('data-bot-name','낌새 AI');
script.setAttribute('data-fab-text','통화 시작');
script.setAttribute('data-color','#0f5967');
script.setAttribute('data-show-ai-popup','false');
script.setAttribute('data-auto-open','true');
script.onload=function(){say('위젯을 불러왔습니다. 아래 통화창에서 시작해주세요. 실제 통화 성공 여부는 별도로 확인해야 합니다.');};
script.onerror=function(){script.remove();button.disabled=false;say('Retell 위젯을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');};
document.head.appendChild(script);
});
})();
</script></body></html>
